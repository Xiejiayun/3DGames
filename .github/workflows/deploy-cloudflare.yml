name: Site validation and deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ace:
    name: Validate Ace WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:ace
        env:
          ACE_SCREENSHOTS: ${{ runner.temp }}/ace-screenshots
      - name: Save Ace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-3d-screenshots
          path: ${{ runner.temp }}/ace-screenshots
          retention-days: 7

  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for 3D checks
        run: npx playwright install --with-deps chromium

      - name: Check kart 3D scenes
        run: npm run test:kart
        env:
          KART_SCREENSHOTS: ${{ runner.temp }}/kart-screenshots

      - name: Save kart screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kart-3d-screenshots
          path: ${{ runner.temp }}/kart-screenshots
          retention-days: 7
      - name: Check Flappy Bird 3D scenes
        run: npm run test:flappy
        env:
          FLAPPY_SCREENSHOTS: ${{ runner.temp }}/flappy-screenshots

      - name: Save Flappy Bird screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-3d-screenshots
          path: ${{ runner.temp }}/flappy-screenshots
          retention-days: 7

      - name: Test CS scene regressions
        run: npm test

      - name: Check CS WebGL scenes
        run: npm run test:cs:browser
        env:
          CS_QA_OUTPUT: ${{ runner.temp }}/cs-screenshots

      - name: Save CS screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-3d-screenshots
          path: ${{ runner.temp }}/cs-screenshots
          retention-days: 7

      - name: Build static site
        run: npm run build

      - name: Check homepage previews and navigation
        run: npm run test:home

      - name: Check Prism Vault puzzles and controls
        run: npm run test:prism

      - name: Validate deployment package (dry run, no upload)
        run: npx cf deploy --prebuilt --mode production --dry-run

  deploy:
    name: Deploy production (main only)
    needs: [validate, ace]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validated commit
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          npx cf deploy --prebuilt --mode production

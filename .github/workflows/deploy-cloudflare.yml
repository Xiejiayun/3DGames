name: Deploy HTML to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install deployment tools
        run: npm ci

      - name: Install browser for kart checks
        run: npx playwright install --with-deps chromium

      - name: Check kart 3D scenes
        run: npm run test:kart
        env:
          KART_SCREENSHOTS: ${{ runner.temp }}/kart-screenshots

      - name: Save kart screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kart-3d-screenshots
          path: ${{ runner.temp }}/kart-screenshots
          retention-days: 7
      - name: Check Flappy Bird 3D scenes
        run: npm run test:flappy
        env:
          FLAPPY_SCREENSHOTS: ${{ runner.temp }}/flappy-screenshots

      - name: Save Flappy Bird screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-3d-screenshots
          path: ${{ runner.temp }}/flappy-screenshots
          retention-days: 7

      - name: Test CS scene regressions
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Validate deployment
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          npx cf deploy --prebuilt --mode production

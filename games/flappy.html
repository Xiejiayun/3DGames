<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird 3D</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%232e79c7'/%3E%3Cstop offset='1' stop-color='%237bc4ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cellipse cx='29' cy='34' rx='18' ry='15' fill='%23ffd659'/%3E%3Cellipse cx='24' cy='37' rx='9' ry='6' fill='%23fff3b8'/%3E%3Ccircle cx='37' cy='28' r='6' fill='%23fff'/%3E%3Ccircle cx='39' cy='28' r='2.8' fill='%231b2530'/%3E%3Cpolygon points='44,32 58,36 44,41' fill='%23ff7b29'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff;
    --muted: rgba(255, 255, 255, 0.74);
    --glass: rgba(16, 26, 38, 0.48);
    --glass-strong: rgba(16, 26, 38, 0.66);
    --line: rgba(255, 255, 255, 0.22);
    --chip: rgba(255, 255, 255, 0.12);
    --chip-hover: rgba(255, 255, 255, 0.2);
    --chip-on: rgba(255, 255, 255, 0.28);
    --accent: #ffb62e;
    --accent-deep: #f2870f;
    --accent-ink: #3a2203;
    --danger: #ff7a59;
    --badge: #ff4d4d;
    --shade: rgba(0, 0, 0, 0.32);
    --sky-a: #7fb2dd;
    --sky-b: #d3e8f4;
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    inline-size: 100%; block-size: 100%; overflow: hidden; background: var(--sky-a);
    font-family: var(--font); color: var(--paper);
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  button { font-family: inherit; }
  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- in-game HUD ---------- */
  #score {
    position: absolute; inset-block-start: max(3.2vh, env(safe-area-inset-top)); inset-inline: 0; text-align: center;
    font-size: clamp(46px, 9.5vh, 96px); font-weight: 900; line-height: 1; letter-spacing: 1px; display: none;
    text-shadow: 0 3px 0 var(--shade), 0 10px 28px rgba(0, 0, 0, 0.4);
  }
  #score.pop { animation: pop 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .chip svg, .top-btn svg { inline-size: 18px; block-size: 18px; flex: none; }
  #topBtns {
    position: absolute; inset-block-start: max(14px, env(safe-area-inset-top)); inset-inline-start: 14px;
    display: flex; gap: 8px; z-index: 4;
  }
  .top-btn {
    pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 999px; background: var(--glass); color: var(--paper);
    inline-size: 38px; block-size: 38px; padding: 0;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: background .15s;
  }
  .top-btn:hover { background: var(--glass-strong); }
  .top-btn.off { opacity: 0.55; }
  #pauseBtn { display: none; }
  #pausePanel { justify-content: center; gap: 18px; background: rgba(8, 14, 22, 0.44); }
  .pause-title { font-size: clamp(32px, 6vw, 56px); font-weight: 900; letter-spacing: 2px; text-shadow: 0 3px 0 var(--shade); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .start.ghost { background: var(--glass-strong); color: var(--paper); border: 1px solid var(--line); }
  .medal { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--chip); }
  .medal.bronze { color: #e29d5e; border: 1px solid rgba(226,157,94,.45); }
  .medal.silver { color: #e2e8f0; border: 1px solid rgba(226,232,240,.5); }
  .medal.gold { color: #ffd659; border: 1px solid rgba(255,214,89,.55); }
  .medal.plat { color: #8ce8ff; border: 1px solid rgba(140,232,255,.6); }

  /* ---------- panels ---------- */
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0s linear 0.35s;
  }
  .panel.show { opacity: 1; visibility: visible; transition: opacity 0.35s ease; }
  .panel:not(.show), .panel:not(.show) * { pointer-events: none !important; }

  #startPanel {
    justify-content: space-between;
    padding: max(4.5vh, env(safe-area-inset-top)) 14px max(3vh, env(safe-area-inset-bottom));
  }
  .title {
    font-size: clamp(32px, 7vw, 74px); font-weight: 900; letter-spacing: 2px; line-height: 1.05; text-align: center;
    text-shadow: 0 3px 0 var(--shade), 0 12px 34px rgba(0, 0, 0, 0.45);
  }
  .title span { color: var(--accent); }
  .menu {
    pointer-events: auto; inline-size: min(620px, 100%); max-block-size: 100%; overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 12px; flex: none;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 14px;
    -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.3);
  }
  .menu-label { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); margin-block-end: 7px; }
  .choices { display: grid; gap: 8px; }
  #birdChoices { grid-template-columns: repeat(3, 1fr); }
  #qualChoices { grid-template-columns: repeat(4, 1fr); }
  .qual-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block-end: 7px; }
  .qual-head .menu-label { margin-block-end: 0; }
  .qual-note { font-size: 11px; font-weight: 700; color: var(--accent); opacity: 0.92; }
  .chip {
    pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 2px solid transparent; border-radius: 16px; background: var(--chip); color: var(--paper);
    font-size: 15px; font-weight: 700; line-height: 1.2; padding: 10px 8px;
    transition: transform 0.12s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip:active { transform: scale(0.96); }
  .chip.sel { background: var(--chip-on); border-color: var(--paper); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.16); }
  .chip.bird { flex-direction: column; gap: 3px; padding: 8px 6px 9px; }
  .chip.bird canvas { inline-size: 46px; block-size: 46px; }
  .start {
    pointer-events: auto; cursor: pointer; border: 0; border-radius: 16px; padding: 13px 34px;
    background: linear-gradient(var(--accent), var(--accent-deep)); color: var(--accent-ink);
    font-size: clamp(18px, 3vw, 22px); font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.28), 0 12px 24px rgba(0, 0, 0, 0.25); transition: transform 0.08s, filter 0.15s;
  }
  .start:hover { filter: brightness(1.07); }
  .start:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28); }
  .hint { font-size: 12.5px; color: var(--muted); text-align: center; }

  #overPanel { justify-content: center; gap: 2.2vh; background: rgba(8, 14, 22, 0.34); }
  .go-title {
    font-size: clamp(38px, 8vw, 78px); font-weight: 900; letter-spacing: 2px; color: var(--danger);
    text-shadow: 0 3px 0 var(--shade), 0 12px 34px rgba(0, 0, 0, 0.45);
    transform: translateY(-18px); transition: transform 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  #overPanel.show .go-title { transform: translateY(0); }
  .card {
    min-inline-size: 250px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 20px; padding: 14px 28px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.3);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 26px; margin-block: 6px; }
  .row span { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); }
  .row b { font-size: 38px; font-weight: 900; line-height: 1.1; }
  #newBest {
    display: none; font-style: normal; font-size: 12px; font-weight: 900; color: var(--paper);
    background: var(--badge); padding: 3px 8px; border-radius: 7px; margin-inline-start: auto;
  }

  /* ---------- overlays ---------- */
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0, 0, 0, 0) 58%, rgba(6, 14, 26, 0.26) 100%); }
  #flash { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
  #flash.on { opacity: 0.85; transition: none; }
  #flash.off { opacity: 0; transition: opacity 0.4s ease-out; }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
    background: linear-gradient(var(--sky-a), var(--sky-b)); font-weight: 700; font-size: 16px; text-align: center; padding: 24px;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
  }
  #loading.hide { opacity: 0; visibility: hidden; }
  #loadSlow { font-size: 13px; font-weight: 500; opacity: 0.85; min-block-size: 1.3em; }
  .spinner {
    inline-size: 46px; block-size: 46px; border-radius: 50%;
    border: 5px solid rgba(255, 255, 255, 0.35); border-block-start-color: var(--paper); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadError {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #1d2a38; text-align: center; padding: 24px; font-size: 17px; line-height: 1.6;
  }

  @media (max-height: 470px) {
    #startPanel { padding-block: 8px; }
    .title { font-size: clamp(22px, 7.5vh, 40px); }
    .menu { gap: 8px; padding: 10px 14px; border-radius: 18px; }
    .chip { padding: 6px 8px; font-size: 14px; }
    .chip.bird { flex-direction: row; gap: 5px; padding: 5px 4px; }
    .menu-label { margin-block-end: 4px; }
    .chip.bird canvas { inline-size: 30px; block-size: 30px; }
    .start { padding: 9px 28px; }
    .hint { display: none; }
    .card { padding: 8px 24px; }
    .row b { font-size: 30px; }
    .go-title { font-size: clamp(26px, 12vh, 44px); }
    #overPanel { gap: 8px; }
    #overPanel .hint { display: none; }
  }
  @media (max-height: 290px) {
    #startPanel { justify-content: center; }
    .title, .go-title { display: none; }
    .card { padding: 4px 20px; }
    .row { margin-block: 2px; }
    .row b { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="ui">
  <div id="vignette"></div>
  <div id="score" aria-live="polite">0</div>
  <div id="topBtns">
    <button id="muteBtn" class="top-btn" type="button" aria-label="Mute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
    </button>
    <button id="pauseBtn" class="top-btn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
  <div id="startPanel" class="panel">
    <div class="title">FLAPPY BIRD <span>3D</span></div>
    <div class="menu" id="menu">
      <div>
        <div class="menu-label" data-i18n="chooseBird"></div>
        <div class="choices" id="birdChoices">
          <button type="button" class="chip bird" data-bird="blue"><canvas width="96" height="96"></canvas><span data-i18n="blue"></span></button>
          <button type="button" class="chip bird" data-bird="red"><canvas width="96" height="96"></canvas><span data-i18n="red"></span></button>
          <button type="button" class="chip bird" data-bird="yellow"><canvas width="96" height="96"></canvas><span data-i18n="yellow"></span></button>
        </div>
      </div>
      <div>
        <div class="qual-head">
          <div class="menu-label" data-i18n="chooseQual"></div>
          <span class="qual-note" id="qualNote"></span>
        </div>
        <div class="choices" id="qualChoices">
          <button type="button" class="chip" data-qual="auto" data-i18n="qualAuto"></button>
          <button type="button" class="chip" data-qual="high" data-i18n="qualHigh"></button>
          <button type="button" class="chip" data-qual="med" data-i18n="qualMed"></button>
          <button type="button" class="chip" data-qual="low" data-i18n="qualLow"></button>
        </div>
      </div>
      <button type="button" id="startBtn" class="start" data-i18n="start"></button>
      <div class="hint" data-i18n="hint"></div>
    </div>
  </div>

  <div id="pausePanel" class="panel">
    <div class="pause-title" data-i18n="paused"></div>
    <div class="btn-row">
      <button id="resumeBtn" type="button" class="start" data-i18n="resume"></button>
      <button id="pauseRestartBtn" type="button" class="start ghost" data-i18n="restart"></button>
    </div>
  </div>

  <div id="overPanel" class="panel">
    <div class="go-title" data-i18n="over"></div>
    <div class="card">
      <div class="row"><span data-i18n="score"></span><b id="finalScore">0</b></div>
      <div class="row"><span data-i18n="best"></span><em id="newBest" data-i18n="newBest"></em><b id="bestScore">0</b></div>
      <div class="row"><span data-i18n="medal"></span><span id="medalBadge" class="medal">—</span></div>
    </div>
    <button id="playBtn" type="button" class="start" data-i18n="again"></button>
    <div class="hint" data-i18n="againHint"></div>
  </div>

  <div id="flash"></div>
  <div id="loading"><div class="spinner"></div><div id="loadingText">Loading…</div><div id="loadSlow"></div></div>
  <div id="loadError"><div></div></div>
</div>

<script type="module">
/* =====================================================================
   FLAPPY BIRD 3D  —  single file, no external images or audio.
   Three.js r186 comes from a CDN; every texture, model and sound is generated in code.
   ===================================================================== */
const $ = id => document.getElementById(id);

/* ---------------------------------------------------------------------
   0. Language + boot helpers
   --------------------------------------------------------------------- */
const LANG = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
const TEXT = {
  zh: {
    loading: '正在搭建场景…', slow: '加载比较慢。如果一直停在这里，请检查网络后刷新页面。',
    loadSky: '正在计算天空与光照…', loadMtn: '正在生成远山…', loadCloud: '正在生成云朵…', loadLand: '正在铺设地形…',
    chooseBird: '选择小鸟', blue: '小蓝', red: '小红', yellow: '小黄',
    chooseQual: '画质模式', qualAuto: '自动', qualHigh: '高', qualMed: '中', qualLow: '低 (CPU)', qualCpuHint: '检测到无GPU软渲染，已自动启用低画质',
    start: '开始游戏', hint: '点击画面 / 空格 / ↑ 起飞 · ← → 换小鸟 · P 暂停 · M 静音', hintTouch: '点击屏幕任意位置起飞',
    over: '游戏结束', score: '得分', best: '最高分', newBest: '新纪录', again: '再玩一次', againHint: '也可以按 空格 / 回车',
    paused: '已暂停', resume: '继续游戏', restart: '重新开始',
    medal: '奖牌', medalNone: '暂无', medalBronze: '🥉 铜牌', medalSilver: '🥈 银牌', medalGold: '🥇 金牌', medalPlat: '💎 白金',
    errCdn: '3D 引擎（Three.js）加载失败。请检查网络连接后刷新页面。',
    errGl: '当前浏览器无法启用 WebGL，3D 游戏无法运行。',
    contextLost: '图形连接中断，正在恢复场景…'
  },
  en: {
    loading: 'Building the scene…', slow: 'This is taking a while. If it stays here, check your connection and reload.',
    loadSky: 'Computing the sky and light…', loadMtn: 'Raising the mountains…', loadCloud: 'Growing the clouds…', loadLand: 'Laying out the land…',
    chooseBird: 'CHOOSE YOUR BIRD', blue: 'Blue', red: 'Red', yellow: 'Yellow',
    chooseQual: 'GRAPHICS', qualAuto: 'Auto', qualHigh: 'High', qualMed: 'Med', qualLow: 'Low (CPU)', qualCpuHint: 'Software WebGL detected — Low mode active',
    start: 'Start', hint: 'Click / Space / ↑ flap  ·  ← → bird  ·  P pause  ·  M mute', hintTouch: 'Tap anywhere to flap',
    over: 'GAME OVER', score: 'SCORE', best: 'BEST', newBest: 'NEW', again: 'Play Again', againHint: 'or press Space / Enter',
    paused: 'PAUSED', resume: 'Resume', restart: 'Restart',
    medal: 'MEDAL', medalNone: 'NONE', medalBronze: '🥉 BRONZE', medalSilver: '🥈 SILVER', medalGold: '🥇 GOLD', medalPlat: '💎 PLATINUM',
    errCdn: 'Could not load the 3D engine (Three.js). Check your connection and reload the page.',
    errGl: 'WebGL is not available in this browser, so the 3D game cannot start.',
    contextLost: 'Graphics connection lost. Restoring the scene…'
  }
}[LANG];
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = TEXT[el.dataset.i18n];
$('loadingText').textContent = TEXT.loading;
const slowTimer = setTimeout(() => { $('loadSlow').textContent = TEXT.slow; }, 12000);
function showError(msg) {
  clearTimeout(slowTimer);
  const box = $('loadError');
  box.firstElementChild.textContent = msg;
  box.style.display = 'flex';
  $('loading').classList.add('hide');
}
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
function setLoading(key) { $('loadingText').textContent = TEXT[key]; return nextFrame(); }

/* ---------------------------------------------------------------------
   1. Three.js from a CDN (pinned version, second CDN as fallback)
   --------------------------------------------------------------------- */
const CDN_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js',
  'https://unpkg.com/three@0.186.1/build/three.module.js'
];
function loadThree() {
  const primary = import(CDN_URLS[0]);
  const backup = new Promise((resolve, reject) => {
    let started = false;
    const start = () => { if (!started) { started = true; import(CDN_URLS[1]).then(resolve, reject); } };
    const timer = setTimeout(start, 7000);
    primary.then(() => clearTimeout(timer), start);
  });
  return Promise.any([primary, backup]);
}
let THREE = null;
try { THREE = await loadThree(); }
catch (err) { showError(TEXT.errCdn); throw new Error('Three.js could not be loaded from either CDN'); }

/* ---------------------------------------------------------------------
   2. Config
   --------------------------------------------------------------------- */
const CFG = {
  STEP: 1 / 240,          // fixed physics step (s): identical feel on 60 / 120 / 144 Hz
  GRAVITY: 21,            // units / s^2
  FLAP_V: 8.2,            // upward velocity after a flap
  MAX_FALL: 13.5,         // terminal velocity
  SPEED: 4.6,             // forward speed (units / s)
  PIPE_GAP: 3.7,          // gap height
  PIPE_SPACING: 7.6,
  PIPE_COUNT: 14,
  FIRST_PIPE_X: 18,
  PIPE_R: 0.95, RIM_R: 1.2, RIM_H: 0.6,
  GAP_MIN: 3.4, GAP_MAX: 9.8, GAP_MAX_DELTA: 3.6,
  START_Y: 6.2, CEILING: 14, GROUND_Y: 0,
  REST_Y: 0.5,            // bird centre height when it lies on the ground
  HITBOX_SCALE: 0.9,      // bird hitbox is 10% smaller than its body
  SHAKE_DUR: 0.45,
  BEST_KEY: 'flappy3d_best', BIRD_KEY: 'flappy3d_bird', MUTE_KEY: 'flappy3d_mute', QUAL_KEY: 'flappy3d_qual'
};
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => smooth01((x - a) / (b - a));          // works for a > b too
const damp = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));

/* ---------------------------------------------------------------------
   3. Renderer, scene, camera
   --------------------------------------------------------------------- */
const COARSE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);   // phones / tablets
function detectSoftwareGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return false;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '') : String(gl.getParameter(gl.RENDERER) || '');
    const sw = /swiftshader|llvmpipe|softpipe|software|basic render driver|mesa offscreen/i.test(r);
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return sw;
  } catch { return false; }
}
const IS_SOFTWARE_GL = detectSoftwareGL();
const WORLD_SEED = (() => {
  const q = new URLSearchParams(location.search).get('seed');
  return q !== null && /^\d{1,9}$/.test(q) ? Number(q) : Math.floor(Math.random() * 999983);
})();

// Lathe profile with helper points next to every corner of a flat face: flats keep clean normals, bevels stay round.
function latheProfile(pts, bevel) {
  const out = [], e = 0.012;
  pts.forEach((p, i) => {
    const a = pts[i - 1], b = pts[i + 1];
    const da = a ? Math.hypot(p[0] - a[0], p[1] - a[1]) : 0, db = b ? Math.hypot(b[0] - p[0], b[1] - p[1]) : 0;
    if (a && da > bevel * 2) out.push(new THREE.Vector2(p[0] + (a[0] - p[0]) / da * e, p[1] + (a[1] - p[1]) / da * e));   // helper on the long (flat) side only
    out.push(new THREE.Vector2(p[0], p[1]));
    if (b && db > bevel * 2) out.push(new THREE.Vector2(p[0] + (b[0] - p[0]) / db * e, p[1] + (b[1] - p[1]) / db * e));

let actx = null, master = null, noiseBuf = null, windGain = null;

      let acc = 0;
      for (let i = 0; i < w.length; i++) { acc = (acc + (Math.random() * 2 - 1) * 0.04) * 0.996; w[i] = acc * 3; }
      for (let i = 0; i < 2000; i++) { const k = i / 2000; w[i] *= k; w[w.length - 1 - i] *= k; }          // fade the loop ends
      const src = actx.createBufferSource(), lp = actx.createBiquadFilter();
      src.buffer = wb; src.loop = true;
      lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.3;
      windGain = actx.createGain();
      windGain.gain.value = 0;
      src.connect(lp).connect(windGain).connect(master);

  const h = window.innerHeight || 1, t = document.querySelector('#startPanel .title').getBoundingClientRect(), m = $('menu').getBoundingClientRect();
  if (t.height > 0 && m.height > 0 && m.top > t.bottom) { showBand.top = t.bottom / h; showBand.bottom = m.top / h; }

    camera.position.y += (Math.random() * 2 - 1) * m;

/* ---------------------------------------------------------------------
   19. Physics (fixed time step)
   --------------------------------------------------------------------- */
function scrollWorld(h, movePipes) {
  const sp = movePipes ? curSpeed() : CFG.SPEED;
  scroll += sp * h;
  if (!movePipes) return;
  let maxX = -Infinity;
  for (const p of pipes) {
    p.setX(p.x - sp * h);
    if (p.bobAmp > 0) {
      p.bobPhase += p.bobSpeed * h;
      const y = p.baseY + Math.sin(p.bobPhase) * p.bobAmp;
      p.lo = y - CFG.PIPE_GAP / 2; p.hi = y + CFG.PIPE_GAP / 2; p.pose();
    }
    if (p.x > maxX) maxX = p.x;
  }
  for (const p of pipes) {
    if (p.x < -26) {
      lastGapY = randomGap(lastGapY);
      maxX += CFG.PIPE_SPACING;
      p.setX(maxX); p.scored = false; p.appear = 0;
      const move = score >= 12 && Math.random() < 0.28;
      p.bobAmp = move ? 0.8 + Math.random() * 0.5 : 0;
      p.bobSpeed = move ? 1.4 + Math.random() * 0.8 : 0;
      p.bobPhase = Math.random() * TAU;
      p.setGap(lastGapY, CFG.PIPE_GAP);
    }
  }
}
function update(h) {
  if (paused) return;
  if (state === 'start') {
    bobT += h;
    birdY = CFG.START_Y + Math.sin(bobT * 3.2) * 0.16;
    vy = 0;
    pitch = damp(pitch, Math.sin(bobT * 3.2 + 0.6) * 0.1, 8, h);
    scrollWorld(h, false);
  } else if (state === 'play') {
    vy = Math.max(vy - CFG.GRAVITY * h, -CFG.MAX_FALL);
    birdY += vy * h;
    if (birdY > CFG.CEILING) { birdY = CFG.CEILING; if (vy > 0) vy = 0; }
    const target = vy > 0 ? Math.min(0.55, vy * 0.06) : Math.max(-1.35, vy * 0.085);
    pitch = damp(pitch, target, vy > 0 ? 14 : 6, h);
    scrollWorld(h, true);

    for (const p of pipes) {
      if (!p.scored && p.x < 0) { p.scored = true; setScore(score + 1); sfxPoint(); }
    }
    birdBox.setFromCenterAndSize(birdCenter.set(0, birdY, 0), bird.hitSize);
    if (birdBox.min.y <= CFG.GROUND_Y) { birdY = CFG.REST_Y; die(true); return; }
    for (const p of pipes) {
      if (Math.abs(p.x) > CFG.RIM_R + 1.5) continue;
      p.updateBoxes();
      for (const box of p.boxes) if (birdBox.intersectsBox(box)) { die(false, p); return; }
    }
  } else if (state === 'dying') {
    dyingT += h;
    if (!landed) {
      const hx = bird.hitSize.x / 2, hy = bird.hitSize.y / 2;
      let over = false, support = -Infinity;               // is a pipe under the bird, and where is its top?
      for (const p of pipes) {
        if (Math.abs(p.x) < CFG.RIM_R + hx) { over = true; if (birdY - hy > p.lo - 0.4) support = Math.max(support, p.lo); }
      }
      knockV = over ? Math.max(knockV, 3) : damp(knockV, 0, 7, h);
      const dx = knockDir * knockV * h;                    // the world shifts under the bird
      scroll -= dx;
      for (const p of pipes) p.setX(p.x + dx);
      vy = Math.max(vy - CFG.GRAVITY * h, -CFG.MAX_FALL);
      birdY += vy * h;
      if (birdY - hy < support) { birdY = support + hy; if (vy < 0) vy = 0; }      // slide along the top of a pipe, never through it
      if (birdY <= CFG.REST_Y) { birdY = CFG.REST_Y; vy = 0; landed = true; }
    }
    pitch = damp(pitch, -1.45, 7, h);
    if (landed && dyingT > 0.6) showGameOver();

  }
}

/* ---------------------------------------------------------------------
   20. Per-frame visuals
   --------------------------------------------------------------------- */
const _fwd = new THREE.Vector3();
let viewMix = 0;
function animateVisuals(dt) {
  dt = paused ? 0 : dt; // One visual clock freezes particles, clouds, blinking and pipe reveals too.
  const alive = state === 'start' || state === 'play';
  if (!paused) showT += dt;

  // --- bird ---
  bird.root.position.set(0, birdY, 0);
  bird.root.rotation.z = pitch;
  squash = damp(squash, 0, 9, dt);
  bird.body.scale.set(1 - 0.07 * squash, 1 + 0.1 * squash, 1 - 0.07 * squash);
  flapBoost = Math.max(0, flapBoost - dt * 3);
  if (alive && !paused) {
    wingPhase += dt * (11 + flapBoost * 28);
    const a = Math.sin(wingPhase) * (0.5 + flapBoost * 0.55) + 0.12;
    for (const w of bird.wings) w.rotation.x = -w.userData.side * a;
    bird.tail.rotation.y = Math.sin(wingPhase * 0.5) * 0.12;
  } else if (!paused) {
    for (const w of bird.wings) w.rotation.x = damp(w.rotation.x, w.userData.side * 0.4, 6, dt);
  }
  blinkT -= dt;
  if (blinkT < -0.13) blinkT = 2 + Math.random() * 3;
  const shut = !alive || blinkT < 0;
  for (const e of bird.eyes) e.scale.y = damp(e.scale.y, shut ? 0.12 : 1.12, 30, dt);
  for (const g of bird.glints) g.visible = !shut;

  // --- feathers ---
  for (const f of feathers) {
    if (f.life <= 0) continue;
    f.life -= dt;
    if (f.life <= 0) { f.m.visible = false; continue; }
    f.vy -= 9 * dt;
    f.vx *= Math.exp(-2.2 * dt); f.vz *= Math.exp(-2.2 * dt);
    f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
    f.m.rotation.x += f.rx * dt; f.m.rotation.y += f.ry * dt; f.m.rotation.z += f.rz * dt;
    f.m.material.opacity = clamp(f.life / (f.max * 0.4), 0, 1);
  }

  // --- scenery loop ---
  for (const c of chunks) {
    let wx = (c.x0 - scroll + BACK) % LOOP;
    if (wx < 0) wx += LOOP;
    wx -= BACK;

    const cx = wx + CHUNK_L / 2;

  }

  // --- water ripples, lake mist, distant flock ---

  waterUniforms.uRipB.value.set((scroll / RIPPLE_TILE * 0.37 - showT * 0.016) % 1, (showT * -0.011) % 1);
  if (!paused) windDrift += CLOUD_WIND * dt;
  for (const m of lakeMist) m.visible = qCfg.mist;
  flock.visible = qCfg.mist;
  if (qCfg.mist) {
    for (const m of lakeMist) {
      m.position.x -= dt * (1.2 + sp * 0.6);

    }
    flock.position.x -= dt * (4.5 + sp * 0.25);

  updateFar(scroll);
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  viewMix = clamp(_fwd.x / Math.max(1e-3, Math.hypot(_fwd.x, _fwd.z)), 0, 1);
  updateClouds(camera.position, viewMix);
  ATMO_U.uCloudOff.value = (scroll + windDrift) % CS.PX;
  if (!paused) skyUniforms.uCirrusOff.value.x += dt * 0.004;

  if (windGain) {
    const target = state === 'play' && !paused ? 0.045 + Math.min(0.06, Math.abs(vy) * 0.004) : 0.015;
    windGain.gain.value = damp(windGain.gain.value, target, 3, dt);
  }
}

/* ---------------------------------------------------------------------
   21. Resize + adaptive resolution
   --------------------------------------------------------------------- */

function onResize() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  camera.aspect = aspect;
  sideCam.dist = aspect < 1.2 ? 17 * Math.min(2.3, 1.2 / aspect) : 17;      // pull back on portrait screens so the playfield still fits
  const k = Math.min(1, aspect);
  sideCam.x = 4.2 * k;
  sideCam.lookX = 4.2 * k;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(adaptive.pixelRatio);
  renderer.setSize(w, h);
  measureShowBand();
}
window.addEventListener('resize', onResize);

/* ---------------------------------------------------------------------
   22. Main loop: real deltaTime feeds a fixed-step accumulator
   --------------------------------------------------------------------- */
function setQuality(pref) {
  qualPref = ['auto', 'high', 'med', 'low'].includes(pref) ? pref : 'auto';
  try { localStorage.setItem(CFG.QUAL_KEY, qualPref); } catch {}
  const resolved = resolveQual(qualPref);
  qCfg = QUAL_PRESETS[resolved];
  QUALITY.maxPixelRatio = qCfg.maxPixelRatio;
  QUALITY.shadowSize = qCfg.shadowSize;
  QUALITY.grass = qCfg.grass;
  QUALITY.clouds = qCfg.clouds;
  if (QUALITY.farStep !== qCfg.farStep) {
    QUALITY.farStep = qCfg.farStep;
    for (const mesh of farMeshes) { bgScene.remove(mesh); mesh.geometry.dispose(); }
    farMeshes.length = 0;
    buildFarBands();
  }
  renderer.shadowMap.enabled = qCfg.shadows;
  if (sun.shadow.mapSize.x !== qCfg.shadowSize) {
    sun.shadow.mapSize.set(qCfg.shadowSize, qCfg.shadowSize);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    sun.shadow.needsUpdate = true;
  }
  renderer.toneMapping = qCfg.simpleSky ? THREE.NoToneMapping : THREE.NeutralToneMapping;
  if (qCfg.env && cachedEnvTex) {
    scene.environment = cachedEnvTex;
    scene.environmentIntensity = ENV_K;
  } else {
    scene.environment = null;
    scene.environmentIntensity = 0;
  }
  adaptive.enabled = true;
  adaptive.warmup = 2;
  adaptive.pending = null;
  adaptive.apply(Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio), QUALITY.grass);
  for (const b of document.querySelectorAll('#qualChoices .chip')) b.classList.toggle('sel', b.dataset.qual === qualPref);
  const note = $('qualNote');
  if (note) note.textContent = (qualPref === 'auto' && IS_SOFTWARE_GL) ? TEXT.qualCpuHint : '';
}
for (const b of document.querySelectorAll('#qualChoices .chip')) {
  b.addEventListener('click', () => { ensureAudio(); sfxSelect(); setQuality(b.dataset.qual); });
}

let running = true, booted = false, last = performance.now(), acc = 0;
function renderFrame(dt) {
  animateVisuals(dt);
  camera.updateMatrixWorld();
  bgCamera.position.copy(camera.position); bgCamera.quaternion.copy(camera.quaternion);
  bgCamera.fov = camera.fov; bgCamera.aspect = camera.aspect;
  bgCamera.updateProjectionMatrix(); bgCamera.updateMatrixWorld();
  sky.position.copy(camera.position);
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(bgScene, bgCamera);
  renderer.clearDepth();
  renderer.render(scene, camera);
}
function tick(now) {
  if (!running) return;
  if (qCfg.fpsCap > 0 && (now - last) < (1000 / qCfg.fpsCap) - 1) {
    requestAnimationFrame(tick);
    return;
  }
  let dt = (now - last) / 1000;
  last = now;
  adaptive.sample(dt);
  dt = clamp(dt, 0, 0.1);               // no huge jump after a tab switch
  acc += dt;
  while (acc >= CFG.STEP) { update(CFG.STEP); acc -= CFG.STEP; }
  renderFrame(dt);
  if (!booted) {
    booted = true;
    clearTimeout(slowTimer);
    $('loading').classList.add('hide');
    window.__fb3dReady = true;
  }
  requestAnimationFrame(tick);
}

renderer.domElement.addEventListener('webglcontextlost', event => {
  event.preventDefault();
  running = false;
  window.__fb3dReady = false;
  if (state === 'play') togglePause(true);
  $('loadingText').textContent = TEXT.contextLost;
  $('loading').classList.remove('hide');
});
renderer.domElement.addEventListener('webglcontextrestored', async () => {
  try {
    // All baked render targets lose their contents along with the WebGL context.
    if (cachedEnvTex) cachedEnvTex.dispose();
    cachedEnvTex = null;
    await bakeSky();
    await bakeFarTerrain(scroll, nextFrame);
    await bakeClouds(nextFrame);
    renderer.shadowMap.needsUpdate = true;
    booted = false; acc = 0; last = performance.now(); running = true;
    requestAnimationFrame(tick);
  } catch (err) { showError(TEXT.errGl); console.error('Scene restoration failed', err); }
});

setBird(birdSkin);
squash = 0;
await setLoading('loadSky');
await bakeSky();
await setLoading('loadMtn');
await bakeFarTerrain(scroll, nextFrame);
buildFarBands();
await setLoading('loadCloud');
await bakeClouds(nextFrame);
buildCloudField();
await setLoading('loadLand');
setQuality(qualPref);
resetGame();
for (const p of pipes) { p.appear = 1; p.pose(); }
onResize();
updateCamera(0);
camera.position.copy(camGoal.pos); camera.quaternion.copy(camGoal.quat); camera.fov = camGoal.fov; camera.updateProjectionMatrix();
try { await renderer.compileAsync(bgScene, bgCamera); await renderer.compileAsync(scene, camera); }
catch (err) { try { renderer.compile(bgScene, bgCamera); renderer.compile(scene, camera); } catch (e) { /* optional */ } }
requestAnimationFrame(t => { last = t; tick(t); });
</script>
</body>

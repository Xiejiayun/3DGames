<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Kart 3D · 极速卡丁车</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1828'/%3E%3Cpath d='M12 42 L20 26 L44 26 L52 42 Z' fill='%23ff4d3d'/%3E%3Crect x='24' y='16' width='16' height='12' rx='6' fill='%23ffd447'/%3E%3Ccircle cx='18' cy='44' r='7' fill='%231b2530' stroke='%23eef3f8' stroke-width='2'/%3E%3Ccircle cx='46' cy='44' r='7' fill='%231b2530' stroke='%23eef3f8' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f4f8ff;
    --muted: rgba(235, 243, 255, 0.72);
    --dim: rgba(235, 243, 255, 0.48);
    --glass: rgba(11, 19, 32, 0.62);
    --glass-strong: rgba(11, 19, 32, 0.84);
    --line: rgba(255, 255, 255, 0.16);
    --line-hi: rgba(111, 214, 255, 0.55);
    --chip: rgba(255, 255, 255, 0.08);
    --chip-hover: rgba(255, 255, 255, 0.16);
    --chip-on: rgba(255, 184, 56, 0.22);
    --accent: #ffb62e;
    --accent-deep: #f07d12;
    --accent-ink: #2b1600;
    --cool: #5ce1ff;
    --ok: #68f09c;
    --danger: #ff564a;
    --shade: rgba(0, 0, 0, 0.45);
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "Consolas", "SFMono-Regular", "Menlo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    inline-size: 100%; block-size: 100%; overflow: hidden;
    background: #0a1422; color: var(--paper); font-family: var(--font);
    user-select: none; -webkit-user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  button { font-family: inherit; color: inherit; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

  /* ---------- Top Utility Buttons ---------- */
  #topBtns {
    position: absolute; inset-block-start: max(14px, env(safe-area-inset-top)); inset-inline-start: 14px;
    display: flex; gap: 8px; z-index: 10;
  }
  .top-btn {
    pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 999px; background: var(--glass); color: var(--paper);
    inline-size: 38px; block-size: 38px; padding: 0; font-size: 12px; font-weight: 800;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .15s, border-color .15s;
  }
  .top-btn:hover { background: var(--glass-strong); border-color: var(--line-hi); }
  .top-btn.off { opacity: 0.5; }
  .top-btn svg { inline-size: 18px; block-size: 18px; }
  #pauseBtn, #camBtn { display: none; }
  #camBtn {
    width: auto; padding: 0 14px; gap: 6px;
    position: absolute; inset-block-start: max(14px, env(safe-area-inset-top)); inset-inline-end: 14px;
    z-index: 10;
  }

  /* ---------- Panels ---------- */
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  .panel.show { opacity: 1; visibility: visible; transition: opacity 0.3s ease; }
  .panel:not(.show), .panel:not(.show) * { pointer-events: none !important; }

  #startPanel {
    justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 25%, rgba(20, 42, 74, 0.35), rgba(6, 11, 20, 0.72));
  }
  .brand { text-align: center; }
  .eyebrow {
    font-size: 11px; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; color: var(--cool);
    text-shadow: 0 2px 8px var(--shade);
  }
  .title {
    font-size: clamp(30px, 5.5vw, 56px); font-weight: 900; letter-spacing: 0.04em; line-height: 1.05;
    text-shadow: 0 4px 0 rgba(0,0,0,0.45), 0 12px 32px rgba(0,0,0,0.55);
  }
  .title span { color: var(--accent); }

  .menu {
    pointer-events: auto; inline-size: min(880px, 100%); max-block-size: calc(100vh - 120px);
    overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px;
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  .section-hdr {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .menu-label {
    font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .best-tag {
    font-family: var(--mono); font-size: 11.5px; color: var(--accent);
  }

  .choices-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .chip {
    pointer-events: auto; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--chip);
    transition: transform .14s, background .14s, border-color .14s, box-shadow .14s;
  }
  .chip:hover { background: var(--chip-hover); transform: translateY(-2px); }
  .chip.on {
    background: var(--chip-on); border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(255, 182, 46, 0.35), 0 8px 20px rgba(0,0,0,0.3);
  }
  .chip-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .chip-title { font-size: 14px; font-weight: 800; color: var(--paper); }
  .chip-badge {
    font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,0.12); color: var(--cool);
  }
  .chip.on .chip-badge { background: rgba(255,182,46,0.25); color: var(--accent); }
  .chip-desc { font-size: 11.5px; color: var(--muted); line-height: 1.35; }

  .kart-preview-box {
    inline-size: 100%; block-size: 86px; border-radius: 10px; overflow: hidden;
    background: radial-gradient(circle at 50% 60%, rgba(92,225,255,0.16), rgba(0,0,0,0.35));
    border: 1px solid rgba(255,255,255,0.08);
  }
  .kart-preview-box canvas { inline-size: 100%; block-size: 100%; display: block; }

  .stats { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  .stat-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); }
  .stat-row span:first-child { width: 34px; flex: none; }
  .stat-bar { flex: 1; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--cool), var(--accent)); }

  .track-swatch {
    height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.14);
  }
  .track-swatch.coast { background: linear-gradient(120deg, #1b8fd8, #28c5b8 55%, #f0c975); color: #051c2e; }
  .track-swatch.forest { background: linear-gradient(120deg, #1c5e3a, #418c45 55%, #9c6b3b); color: #f4fff6; }
  .track-swatch.alpine { background: linear-gradient(120deg, #4b7bb8, #9fd4f5 55%, #eef7ff); color: #0b223d; }

  .menu-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .controls-hint { font-size: 12px; color: var(--muted); }
  .controls-hint kbd {
    font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: var(--paper);
  }

  .btn-primary {
    pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px;
    padding: 13px 34px; font-size: 16px; font-weight: 900; letter-spacing: 0.08em;
    background: linear-gradient(180deg, #ffd15c, var(--accent-deep)); color: var(--accent-ink);
    box-shadow: 0 10px 28px rgba(240, 125, 18, 0.42), inset 0 1px 0 rgba(255,255,255,0.45);
    transition: transform .12s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-ghost {
    pointer-events: auto; cursor: pointer; border: 1px solid var(--line); border-radius: 999px;
    padding: 12px 24px; font-size: 14px; font-weight: 800; background: var(--glass-strong); color: var(--paper);
    transition: background .15s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.18); }

  /* ---------- In-Game HUD ---------- */
  #hud { position: absolute; inset: 0; display: none; pointer-events: none; }

  #minimapWrap {
    position: absolute; left: 16px; top: 64px; width: 152px; height: 152px;
    border-radius: 16px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 8px; box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  #minimap { width: 100%; height: 100%; display: block; }

  #raceInfo {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px; padding: 8px 22px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .ri-block { display: flex; align-items: baseline; gap: 6px; }
  .ri-lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--muted); }
  .ri-val { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #hudPos { color: var(--accent); }
  #hudTime { font-family: var(--mono); font-size: 19px; color: var(--cool); }

  #dash {
    position: absolute; right: 20px; bottom: 20px; width: 240px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .speed-card {
    width: 100%; padding: 12px 16px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .speed-top { display: flex; align-items: baseline; justify-content: space-between; }
  #hudSpeed { font-size: 42px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .speed-unit { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.12em; }
  .nitro-row { display: flex; align-items: center; gap: 8px; }
  .nitro-lbl { font-size: 11px; font-weight: 900; color: var(--cool); letter-spacing: 0.1em; }
  .nitro-bar {
    flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.16); overflow: hidden;
  }
  #nitroFill {
    width: 0%; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #35b8ff, #72f0a4, #ffd447);
    transition: width 0.06s linear;
  }
  .capsules { display: flex; gap: 6px; }
  .capsule {
    width: 28px; height: 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.08); transition: background .15s, box-shadow .15s;
  }
  .capsule.ready {
    background: linear-gradient(90deg, #4be2ff, #ffd659);
    border-color: #fff; box-shadow: 0 0 12px rgba(92, 225, 255, 0.8);
  }

  #centerBanner {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  #countdownText {
    font-size: clamp(58px, 12vw, 118px); font-weight: 900; letter-spacing: 0.06em;
    text-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 18px 44px rgba(0,0,0,0.6);
    opacity: 0; transform: scale(0.7); transition: opacity .15s, transform .2s;
  }
  #countdownText.show { opacity: 1; transform: scale(1); }
  #toastText {
    margin-top: 8px; font-size: 22px; font-weight: 900; letter-spacing: 0.12em;
    color: var(--accent); text-shadow: 0 3px 10px rgba(0,0,0,0.75);
    opacity: 0; transition: opacity .2s;
  }
  #toastText.show { opacity: 1; }
  #wrongWay {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    padding: 8px 22px; border-radius: 999px; background: rgba(220, 38, 38, 0.85);
    font-size: 16px; font-weight: 900; letter-spacing: 0.14em; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  /* ---------- Mobile Touch Controls ---------- */
  #touchControls {
    position: absolute; inset: 0; pointer-events: none; display: none;
  }
  .touch-pad {
    position: absolute; bottom: 22px; display: flex; gap: 10px; pointer-events: auto;
  }
  .touch-pad.left { left: 18px; }
  .touch-pad.right { right: 18px; bottom: 132px; }
  .tbtn {
    width: 62px; height: 62px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--glass); color: var(--paper); font-size: 18px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .tbtn:active, .tbtn.active { background: rgba(255,182,46,0.4); border-color: var(--accent); }
  .tbtn.wide { width: 82px; font-size: 13px; }

  /* ---------- Pause & Results ---------- */
  #pausePanel, #resultPanel { background: rgba(6, 10, 18, 0.68); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .modal-card {
    pointer-events: auto; width: min(480px, 100%); border-radius: 22px;
    background: var(--glass-strong); border: 1px solid var(--line); padding: 26px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  }
  .modal-title { font-size: 32px; font-weight: 900; letter-spacing: 0.04em; }
  .result-rank {
    font-size: 48px; font-weight: 900; color: var(--accent);
    text-shadow: 0 4px 16px rgba(255,182,46,0.35);
  }
  .standings { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .standing-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.06);
    font-size: 13.5px; font-weight: 700;
  }
  .standing-row.me { background: rgba(255, 182, 46, 0.2); border: 1px solid rgba(255, 182, 46, 0.5); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* ---------- Loading & Error ---------- */
  #loading, #errBox {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #0a1422; z-index: 50; text-align: center; padding: 24px;
  }
  #loading.hide { display: none; }
  #errBox { display: none; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.16);
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 740px) {
    .choices-3 { grid-template-columns: 1fr; }
    .kart-preview-box { block-size: 64px; }
    #minimapWrap { width: 112px; height: 112px; top: 60px; left: 10px; }
    #dash { width: 185px; right: 12px; bottom: 14px; }
    #hudSpeed { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText" style="font-size:14px;color:rgba(255,255,255,0.75);font-weight:700;">正在加载 3D 引擎...</div>
</div>
<div id="errBox">
  <div style="font-size:16px;font-weight:700;max-width:420px;"></div>
</div>

<div id="ui">
  <div id="topBtns">
    <button id="pauseBtn" class="top-btn" title="暂停 / Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="muteBtn" class="top-btn" title="声音 / Sound">
      <svg id="iconSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <svg id="iconSoundOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <button id="qualBtn" class="top-btn" title="画质 / Quality">HQ</button>
    <button id="langBtn" class="top-btn" title="语言 / Language">中</button>
    <a href="index.html" class="top-btn" title="返回合集 / Hub" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
    </a>
  </div>

  <button id="camBtn" class="top-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span id="camLabel">追尾视角</span>
  </button>

  <!-- Start / Selection Panel -->
  <div id="startPanel" class="panel show">
    <div class="brand">
      <div class="eyebrow" data-i18n="eyebrow">ZERO-ASSET 3D KART RACING · THREE.JS</div>
      <h1 class="title">TURBO <span>KART</span> 3D</h1>
    </div>

    <div class="menu">
      <div>
        <div class="section-hdr">
          <div class="menu-label" data-i18n="pickChar">1. 选择车手形象</div>
        </div>
        <div id="charChoices" class="choices-3"></div>
      </div>

      <div>
        <div class="section-hdr">
          <div class="menu-label" data-i18n="pickTrack">2. 选择竞速赛道</div>
          <div id="bestTimeTag" class="best-tag"></div>
        </div>
        <div id="trackChoices" class="choices-3"></div>
      </div>

      <div>
        <div class="section-hdr">
          <div class="menu-label" data-i18n="pickDiff">3. 选择赛事难度</div>
        </div>
        <div id="diffChoices" class="choices-3"></div>
      </div>

      <div class="menu-foot">
        <div class="controls-hint" data-i18n-html="controls">
          <kbd>W A S D</kbd> / <kbd>↑ ↓ ← →</kbd> 驾驶 · <kbd>Shift</kbd> 漂移集气 · <kbd>Space</kbd> 氮气加速 · <kbd>V</kbd> 视角
        </div>
        <button id="startBtn" class="btn-primary" data-i18n="startRace">开始比赛</button>
      </div>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="hud">
    <div id="minimapWrap"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="raceInfo">
      <div class="ri-block"><span class="ri-lbl" data-i18n="hudPos">排名</span><span id="hudPos" class="ri-val">1/4</span></div>
      <div class="ri-block"><span class="ri-lbl" data-i18n="hudLap">圈数</span><span id="hudLap" class="ri-val">1/3</span></div>
      <div class="ri-block"><span class="ri-lbl" data-i18n="hudTime">用时</span><span id="hudTime" class="ri-val">00:00.00</span></div>
    </div>

    <div id="centerBanner">
      <div id="countdownText"></div>
      <div id="toastText"></div>
    </div>
    <div id="wrongWay" data-i18n="wrongWay">逆行警告！</div>

    <div id="dash">
      <div class="speed-card">
        <div class="speed-top">
          <span id="hudSpeed">0</span>
          <span class="speed-unit">KM/H</span>
        </div>
        <div class="nitro-row">
          <span class="nitro-lbl">N2O</span>
          <div class="nitro-bar"><div id="nitroFill"></div></div>
          <div class="capsules">
            <div id="cap0" class="capsule"></div>
            <div id="cap1" class="capsule"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="touchControls">
      <div class="touch-pad left">
        <button id="tLeft" class="tbtn">◀</button>
        <button id="tRight" class="tbtn">▶</button>
      </div>
      <div class="touch-pad right">

/* ---------------------------------------------------------------------
   3. Procedural Web Audio Engine
   --------------------------------------------------------------------- */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.engineOsc = null;
    this.engineGain = null;
    this.driftGain = null;
  }
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    // Continuous engine hum
    this.engineOsc = this.ctx.createOscillator();
    this.engineOsc.type = 'sawtooth';
    this.engineOsc.frequency.value = 65;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 340;
    this.engineGain = this.ctx.createGain();
    this.engineGain.gain.value = 0;
    this.engineOsc.connect(filter);
    filter.connect(this.engineGain);
    this.engineGain.connect(this.ctx.destination);
    this.engineOsc.start();

    // Continuous drift tire screech (filtered noise)
    const bufSize = this.ctx.sampleRate * 1.5;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1400;
    bp.Q.value = 3.5;
    this.driftGain = this.ctx.createGain();
    this.driftGain.gain.value = 0;
    noise.connect(bp);
    bp.connect(this.driftGain);
    this.driftGain.connect(this.ctx.destination);
    noise.start();
  }
  updateEngine(speedRatio, drifting, active) {
    if (!this.ctx || !this.engineGain) return;
    const now = this.ctx.currentTime;
    if (muted || !active) {
      this.engineGain.gain.setTargetAtTime(0, now, 0.06);
      this.driftGain.gain.setTargetAtTime(0, now, 0.05);
      return;
    }
    const freq = 58 + speedRatio * 135;
    this.engineOsc.frequency.setTargetAtTime(freq, now, 0.05);
    this.engineGain.gain.setTargetAtTime(0.045 + speedRatio * 0.04, now, 0.06);
    this.driftGain.gain.setTargetAtTime(drifting ? 0.055 : 0, now, 0.04);
  }
  beep(freq = 520, dur = 0.14, type = 'sine', vol = 0.12) {
    if (muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(now); o.stop(now + dur);
  }
  boost() {
    if (muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(190, now);
    o.frequency.exponentialRampToValueAtTime(680, now + 0.35);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(now); o.stop(now + 0.45);
  }
  pickup() {
    this.beep(740, 0.09, 'sine', 0.1);
    setTimeout(() => this.beep(1040, 0.12, 'sine', 0.1), 55);
  }
  bump() {
    this.beep(110, 0.1, 'square', 0.07);
  }
  lap() {
    this.beep(660, 0.1, 'triangle', 0.12);
    setTimeout(() => this.beep(880, 0.16, 'triangle', 0.12), 90);
  }
  win() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.22, 'triangle', 0.13), i * 110));
  }
}

/* ---------------------------------------------------------------------
   4. Procedural 3D Kart & Driver Builder (Reused in Menu & Race)

function buildKartMesh(charCfg) {
  const root = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: charCfg.bodyColor, roughness: 0.32, metalness: 0.25 });
  const trimMat = new THREE.MeshStandardMaterial({ color: charCfg.trimColor, roughness: 0.4, metalness: 0.2 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1b2028, roughness: 0.7, metalness: 0.1 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x15181e, roughness: 0.85 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xd9e2ec, roughness: 0.3, metalness: 0.65 });

  const bodyGroup = new THREE.Group();
  root.add(bodyGroup);

  // Main chassis
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.36, 2.35), bodyMat);
  chassis.position.set(0, 0.42, 0);
  chassis.castShadow = true;
  bodyGroup.add(chassis);

  // Nose cone
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.26, 0.72), trimMat);
  nose.position.set(0, 0.38, 1.32);
  nose.rotation.x = 0.12;
  nose.castShadow = true;
  bodyGroup.add(nose);

  // Side pods
  for (const s of [-1, 1]) {
    const pod = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.28, 1.35), trimMat);
    pod.position.set(s * 0.78, 0.40, 0.05);
    pod.castShadow = true;
    bodyGroup.add(pod);
  }

  // Rear Spoiler
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.08, 0.36), trimMat);
  wing.position.set(0, 0.94, -1.06);
  wing.rotation.x = -0.15;
  wing.castShadow = true;
  bodyGroup.add(wing);
  for (const s of [-1, 1]) {
    const strut = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.38, 0.18), darkMat);
    strut.position.set(s * 0.48, 0.74, -1.02);
    bodyGroup.add(strut);
  }

  // Twin Exhausts & Flame cones
  const flames = [];
  const flameMat = new THREE.MeshBasicMaterial({ color: 0x5ce1ff, transparent: true, opacity: 0.9 });
  for (const s of [-1, 1]) {
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.42, 10), rimMat);
    pipe.rotation.x = Math.PI / 2;
    pipe.position.set(s * 0.32, 0.48, -1.24);
    bodyGroup.add(pipe);

    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.85, 8), flameMat);
    flame.rotation.x = -Math.PI / 2;
    flame.position.set(s * 0.32, 0.48, -1.75);
    flame.visible = false;
    bodyGroup.add(flame);
    flames.push(flame);
  }

  // Driver
  const driver = new THREE.Group();
  driver.position.set(0, 0.62, -0.1);
  bodyGroup.add(driver);

  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.34, 0.52, 12),
    new THREE.MeshStandardMaterial({ color: charCfg.bodyColor, roughness: 0.5 })
  );
  torso.position.y = 0.24;
  torso.castShadow = true;
  driver.add(torso);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 0.66, 0.02);
  driver.add(headGroup);

  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 16, 14),
    new THREE.MeshStandardMaterial({ color: charCfg.helmetColor, roughness: 0.28, metalness: 0.15 })
  );
  helmet.castShadow = true;
  headGroup.add(helmet);

  const visor = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.16, 0.24),
    new THREE.MeshStandardMaterial({ color: charCfg.visorColor, roughness: 0.15, metalness: 0.6 })
  );
  visor.position.set(0, 0.03, 0.22);
  headGroup.add(visor);

  if (charCfg.earStyle === 'ears') {
    for (const s of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 8), new THREE.MeshStandardMaterial({ color: 0x5ce1ff }));
      ear.position.set(s * 0.18, 0.34, -0.02);
      ear.rotation.z = -s * 0.25;
      headGroup.add(ear);
    }
  } else if (charCfg.earStyle === 'fin') {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.42), new THREE.MeshStandardMaterial({ color: 0xffb703 }));
    fin.position.set(0, 0.30, -0.05);
    headGroup.add(fin);
  } else {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.06, 0.22), new THREE.MeshStandardMaterial({ color: 0xe63946 }));
    cap.position.set(0, 0.24, 0.18);
    headGroup.add(cap);
  }

  // Steering wheel
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.03, 8, 16), darkMat);
  wheel.position.set(0, 0.78, 0.48);
  wheel.rotation.x = 0.55;
  bodyGroup.add(wheel);

  // 4 Wheels
  const wheels = [];
  const frontSteerGroups = [];
  const wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.30, 14);
  wheelGeo.rotateZ(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.32, 10);
  hubGeo.rotateZ(Math.PI / 2);

  const wheelCoords = [
    [-0.92, 0.34, 0.88, true],
    [ 0.92, 0.34, 0.88, true],
    [-0.96, 0.36, -0.85, false],
    [ 0.96, 0.36, -0.85, false]
  ];
  for (const [wx, wy, wz, isFront] of wheelCoords) {
    const pivot = new THREE.Group();
    pivot.position.set(wx, wy, wz);
    const wMesh = new THREE.Mesh(wheelGeo, tireMat);
    wMesh.castShadow = true;
    const hub = new THREE.Mesh(hubGeo, rimMat);
    wMesh.add(hub);
    pivot.add(wMesh);
    root.add(pivot);
    wheels.push(wMesh);
    if (isFront) frontSteerGroups.push(pivot);
  }

  return { root, bodyGroup, headGroup, wheels, frontSteerGroups, flames };
}

  const charWrap = $('charChoices');
  charWrap.innerHTML = '';
  previewRenderers.forEach(p => p.renderer.dispose());
  previewRenderers.length = 0;

  CHARS.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (idx === selectedChar ? ' on' : '');
    btn.innerHTML = `
      <div class="chip-head">
        <span class="chip-title">${c.name[lang]}</span>
        <span class="chip-badge">${c.tag[lang]}</span>
      </div>
      <div class="kart-preview-box"><canvas width="240" height="120"></canvas></div>
      <div class="stats">
        <div class="stat-row"><span>${dict.statSpd}</span><div class="stat-bar"><div class="stat-fill" style="width:${c.stats.spd * 20}%"></div></div></div>
        <div class="stat-row"><span>${dict.statAcc}</span><div class="stat-bar"><div class="stat-fill" style="width:${c.stats.acc * 20}%"></div></div></div>
        <div class="stat-row"><span>${dict.statDrf}</span><div class="stat-bar"><div class="stat-fill" style="width:${c.stats.drf * 20}%"></div></div></div>
      </div>
    `;
    btn.addEventListener('click', () => {
      selectedChar = idx;
      sfx.init(); sfx.beep(620, 0.06);
      updateMenuSelections();
    });
    charWrap.appendChild(btn);

    // Mini 3D Preview Renderer
    const cvs = btn.querySelector('canvas');
    const r = new THREE.WebGLRenderer({ canvas: cvs, alpha: true, antialias: true });
    r.setSize(240, 120, false);
    const s = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(36, 2, 0.1, 30);
    cam.position.set(2.4, 1.55, 2.85);
    cam.lookAt(0, 0.55, 0);
    s.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.1));
    const dl = new THREE.DirectionalLight(0xffffff, 1.3);
    dl.position.set(3, 5, 4);
    s.add(dl);
    const kart = buildKartMesh(c);
    s.add(kart.root);
    previewRenderers.push({ renderer: r, scene: s, camera: cam, mesh: kart.root });
  });

  const trackWrap = $('trackChoices');
  trackWrap.innerHTML = '';
  TRACKS.forEach((t, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (idx === selectedTrack ? ' on' : '');
    btn.innerHTML = `
      <div class="track-swatch ${t.swatch}">
        <span>${t.name[lang]}</span>
        <span>${dict.laps}</span>
      </div>
      <div class="chip-head">
        <span class="chip-badge">${t.tag[lang]}</span>
      </div>
      <div class="chip-desc">${t.desc[lang]}</div>
    `;
    btn.addEventListener('click', () => {
      selectedTrack = idx;
      sfx.init(); sfx.beep(620, 0.06);
      updateMenuSelections();
    });
    trackWrap.appendChild(btn);
  });

  const diffWrap = $('diffChoices');
  diffWrap.innerHTML = '';
  DIFFS.forEach((d, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (idx === selectedDiff ? ' on' : '');
    btn.innerHTML = `
      <div class="chip-head">
        <span class="chip-title">${d.name[lang]}</span>
        <span class="chip-badge">${d.tag[lang]}</span>
      </div>
      <div class="chip-desc">${d.desc[lang]}</div>
    `;
    btn.addEventListener('click', () => {
      selectedDiff = idx;
      sfx.init(); sfx.beep(620, 0.06);
      updateMenuSelections();
    });
    diffWrap.appendChild(btn);
  });

  updateMenuSelections();
}

function updateMenuSelections() {
  [...$('charChoices').children].forEach((el, i) => el.classList.toggle('on', i === selectedChar));
  [...$('trackChoices').children].forEach((el, i) => el.classList.toggle('on', i === selectedTrack));
  [...$('diffChoices').children].forEach((el, i) => el.classList.toggle('on', i === selectedDiff));

  const t = TRACKS[selectedTrack];
  const d = DIFFS[selectedDiff];
  const best = getBestTime(t.id, d.id);
  const dict = I18N[lang];
  $('bestTimeTag').textContent = best !== null ? `${dict.bestPrefix}${fmtTime(best)}` : dict.noBest;
}

function applyLang() {
  const dict = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    if (dict[el.dataset.i18n]) el.textContent = dict[el.dataset.i18n];
  });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => {
    if (dict[el.dataset.i18nHtml]) el.innerHTML = dict[el.dataset.i18nHtml];
  });
  $('langBtn').textContent = lang === 'zh' ? '中' : 'EN';
  updateCamLabel();
  buildMenu();
}

  renderer.shadowMap.enabled = highQuality;
  $('qualBtn').textContent = highQuality ? 'HQ' : 'LQ';
  $('qualBtn').classList.toggle('off', !highQuality);
}
applyQuality();

function makeRoadTexture(track) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = track.roadColor;
  g.fillRect(0, 0, 256, 512);
  // Subtle asphalt grain
  for (let i = 0; i < 2400; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.05)';
    g.fillRect(Math.random() * 256, Math.random() * 512, 2, 3);
  }
  // Edge lines
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.fillRect(10, 0, 5, 512);
  g.fillRect(241, 0, 5, 512);
  // Dashed center line
  g.fillStyle = 'rgba(255,215,90,0.72)';
  g.fillRect(125, 40, 6, 180);
  g.fillRect(125, 296, 6, 180);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function makeKerbTexture(track) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = track.kerbA; g.fillRect(0, 0, 64, 64);
  g.fillStyle = track.kerbB; g.fillRect(0, 64, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeCheckerTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  const sq = 16;
  for (let y = 0; y < 64; y += sq) {
    for (let x = 0; x < 256; x += sq) {
      g.fillStyle = ((x / sq + y / sq) % 2 === 0) ? '#ffffff' : '#161a22';
      g.fillRect(x, y, sq, sq);
    }
  }
  return new THREE.CanvasTexture(c);
}

/* ---------------------------------------------------------------------
   7. Track & Realistic 3D Environment Builder
   --------------------------------------------------------------------- */
const SAMPLES = 600;
const ROAD_HALF_W = 7.2;
const WALL_HALF_W = 9.0;

let worldGroup = null;
let trackSamples = [];
let boostPads = [];
let crystals = [];
let snowPoints = null;
let waterMesh = null;

function buildTrackAndWorld(trackCfg) {
  if (worldGroup) {
    scene.remove(worldGroup);
    worldGroup.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
  }
  worldGroup = new THREE.Group();
  scene.add(worldGroup);
  trackSamples = [];
  boostPads = [];
  crystals = [];
  snowPoints = null;
  waterMesh = null;

  // Sky & Fog
  scene.background = new THREE.Color(trackCfg.skyBot);
  scene.fog = new THREE.FogExp2(trackCfg.fogColor, trackCfg.fogDensity);

  // Sky gradient dome
  const skyCanvas = document.createElement('canvas');
  skyCanvas.width = 4; skyCanvas.height = 256;
  const sg = skyCanvas.getContext('2d');
  const grad = sg.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#' + trackCfg.skyTop.toString(16).padStart(6, '0'));
  grad.addColorStop(0.65, '#' + trackCfg.skyBot.toString(16).padStart(6, '0'));
  grad.addColorStop(1, '#' + trackCfg.fogColor.toString(16).padStart(6, '0'));
  sg.fillStyle = grad; sg.fillRect(0, 0, 4, 256);
  const skyTex = new THREE.CanvasTexture(skyCanvas);
  const skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(520, 24, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })
  );
  worldGroup.add(skyDome);

  // Lights
  const hemi = new THREE.HemisphereLight(0xffffff, trackCfg.groundColor, 0.95);
  worldGroup.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff5e4, 1.45);
  sun.position.set(110, 160, 70);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -180; sun.shadow.camera.right = 180;
  sun.shadow.camera.top = 180; sun.shadow.camera.bottom = -180;
  sun.shadow.camera.near = 20; sun.shadow.camera.far = 420;
  worldGroup.add(sun);

  // Build Spline
  const ctrlPts = trackCfg.points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(ctrlPts, true, 'centripetal', 0.5);
  const totalLen = curve.getLength();

  for (let i = 0; i < SAMPLES; i++) {
    const t = i / SAMPLES;
    const pos = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const right = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    trackSamples.push({ t, pos, tangent, right });
  }

  // Procedural Road, Kerb & Barrier Ribbon Geometries
  const roadPos = [], roadUV = [], roadIdx = [];
  const kerbPos = [], kerbUV = [], kerbIdx = [];
  const wallPos = [], wallIdx = [];

  for (let i = 0; i <= SAMPLES; i++) {
    const s = trackSamples[i % SAMPLES];
    const vCoord = (i / SAMPLES) * (totalLen / 14);

    // Road vertices
    const pL = s.pos.clone().addScaledVector(s.right, -ROAD_HALF_W);
    const pR = s.pos.clone().addScaledVector(s.right, ROAD_HALF_W);
    roadPos.push(pL.x, pL.y + 0.05, pL.z, pR.x, pR.y + 0.05, pR.z);
    roadUV.push(0, vCoord, 1, vCoord);

    // Kerbs (left and right strips)
    const kL0 = s.pos.clone().addScaledVector(s.right, -(ROAD_HALF_W + 1.2));
    const kL1 = s.pos.clone().addScaledVector(s.right, -ROAD_HALF_W);
    const kR0 = s.pos.clone().addScaledVector(s.right, ROAD_HALF_W);
    const kR1 = s.pos.clone().addScaledVector(s.right, ROAD_HALF_W + 1.2);
    const kv = (i / SAMPLES) * (totalLen / 4);
    kerbPos.push(
      kL0.x, kL0.y + 0.07, kL0.z, kL1.x, kL1.y + 0.07, kL1.z,
      kR0.x, kR0.y + 0.07, kR0.z, kR1.x, kR1.y + 0.07, kR1.z
    );
    kerbUV.push(0, kv, 1, kv, 0, kv, 1, kv);

    // Low Guardrails
    const wL = s.pos.clone().addScaledVector(s.right, -WALL_HALF_W);
    const wR = s.pos.clone().addScaledVector(s.right, WALL_HALF_W);
    wallPos.push(
      wL.x, wL.y, wL.z, wL.x, wL.y + 0.9, wL.z,
      wR.x, wR.y, wR.z, wR.x, wR.y + 0.9, wR.z
    );

    if (i < SAMPLES) {
      const rBase = i * 2;
      roadIdx.push(rBase, rBase + 1, rBase + 2, rBase + 1, rBase + 3, rBase + 2);

      const kBase = i * 4;
      kerbIdx.push(kBase, kBase + 1, kBase + 4, kBase + 1, kBase + 5, kBase + 4);
      kerbIdx.push(kBase + 2, kBase + 3, kBase + 6, kBase + 3, kBase + 7, kBase + 6);

      const wBase = i * 4;
      wallIdx.push(wBase, wBase + 1, wBase + 4, wBase + 1, wBase + 5, wBase + 4);
      wallIdx.push(wBase + 2, wBase + 6, wBase + 3, wBase + 3, wBase + 6, wBase + 7);
    }
  }

  const roadGeo = new THREE.BufferGeometry();
  roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPos, 3));
  roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUV, 2));
  roadGeo.setIndex(roadIdx);
  roadGeo.computeVertexNormals();
  const roadMesh = new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({
    map: makeRoadTexture(trackCfg), roughness: trackCfg.id === 'alpine' ? 0.35 : 0.78
  }));
  roadMesh.receiveShadow = true;
  worldGroup.add(roadMesh);

  const kerbGeo = new THREE.BufferGeometry();
  kerbGeo.setAttribute('position', new THREE.Float32BufferAttribute(kerbPos, 3));
  kerbGeo.setAttribute('uv', new THREE.Float32BufferAttribute(kerbUV, 2));
  kerbGeo.setIndex(kerbIdx);
  kerbGeo.computeVertexNormals();
  const kerbMesh = new THREE.Mesh(kerbGeo, new THREE.MeshStandardMaterial({ map: makeKerbTexture(trackCfg), roughness: 0.7 }));
  kerbMesh.receiveShadow = true;
  worldGroup.add(kerbMesh);

  const wallGeo = new THREE.BufferGeometry();
  wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallPos, 3));
  wallGeo.setIndex(wallIdx);
  wallGeo.computeVertexNormals();
  const wallMat = new THREE.MeshStandardMaterial({
    color: trackCfg.id === 'alpine' ? 0x99c2e8 : 0xd0d7e2,
    roughness: 0.5, metalness: 0.25, side: THREE.DoubleSide
  });
  const wallMesh = new THREE.Mesh(wallGeo, wallMat);
  wallMesh.castShadow = true;
  worldGroup.add(wallMesh);

  // Start / Finish Line & Gantry Arch
  const s0 = trackSamples[0];
  const finishGroup = new THREE.Group();
  finishGroup.position.copy(s0.pos);
  finishGroup.lookAt(s0.pos.clone().add(s0.tangent));
  const checkStrip = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_HALF_W * 2, 3.2),
    new THREE.MeshBasicMaterial({ map: makeCheckerTexture() })
  );
  checkStrip.rotation.x = -Math.PI / 2;
  checkStrip.position.y = 0.09;
  finishGroup.add(checkStrip);

  const archMat = new THREE.MeshStandardMaterial({ color: 0x222936, roughness: 0.4, metalness: 0.5 });
  for (const side of [-1, 1]) {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 6.2, 0.9), archMat);
    pillar.position.set(side * (ROAD_HALF_W + 1.0), 3.1, 0);
    pillar.castShadow = true;
    finishGroup.add(pillar);
  }
  const banner = new THREE.Mesh(
    new THREE.BoxGeometry(ROAD_HALF_W * 2 + 2.8, 1.5, 1.0),
    new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.35 })
  );
  banner.position.set(0, 6.2, 0);
  banner.castShadow = true;
  finishGroup.add(banner);
  worldGroup.add(finishGroup);

  // Boost Pads & Nitro Crystals
  const padGeo = new THREE.PlaneGeometry(4.4, 5.2);
  const padMat = new THREE.MeshBasicMaterial({ color: 0x3bf0ff, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
  [0.19, 0.48, 0.77].forEach((tVal) => {
    const s = trackSamples[Math.floor(tVal * SAMPLES)];
    const pad = new THREE.Mesh(padGeo, padMat);
    pad.position.copy(s.pos).add(new THREE.Vector3(0, 0.12, 0));
    pad.lookAt(s.pos.clone().add(s.tangent).add(new THREE.Vector3(0, 0.12, 0)));
    pad.rotateX(Math.PI / 2);
    worldGroup.add(pad);
    boostPads.push({ pos: s.pos.clone(), radius: 3.4 });
  });

  const crysGeo = new THREE.OctahedronGeometry(0.62, 0);
  const crysMat = new THREE.MeshStandardMaterial({ color: 0x5ce1ff, emissive: 0x168aad, emissiveIntensity: 0.7, roughness: 0.2 });
  for (let i = 0; i < 12; i++) {
    const tVal = (i + 0.5) / 12;
    const s = trackSamples[Math.floor(tVal * SAMPLES)];
    const lat = (i % 2 === 0 ? 1 : -1) * 2.8;
    const pos = s.pos.clone().addScaledVector(s.right, lat).add(new THREE.Vector3(0, 1.0, 0));
    const mesh = new THREE.Mesh(crysGeo, crysMat);
    mesh.position.copy(pos);
    worldGroup.add(mesh);
    crystals.push({ mesh, pos, cooldown: 0 });
  }

  // Base Ground Plane
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(900, 900),
    new THREE.MeshStandardMaterial({ color: trackCfg.groundColor, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.35;
  ground.receiveShadow = true;
  worldGroup.add(ground);

  // Clouds in Sky
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
  for (let i = 0; i < 18; i++) {
    const cg = new THREE.Group();
    const ang = (i / 18) * Math.PI * 2;
    const rad = 180 + Math.random() * 140;
    cg.position.set(Math.cos(ang) * rad, 55 + Math.random() * 35, Math.sin(ang) * rad);
    for (let j = 0; j < 4; j++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 6, 8, 6), cloudMat);
      puff.position.set((j - 1.5) * 7, Math.random() * 3, (Math.random() - 0.5) * 6);
      puff.scale.y = 0.55;
      cg.add(puff);
    }
    worldGroup.add(cg);
  }

  // Helper: check if (x, z) is safely outside the track corridor
  function isClearOfTrack(x, z, minDist = 14) {
    for (let i = 0; i < SAMPLES; i += 4) {
      const p = trackSamples[i].pos;
      const dx = x - p.x, dz = z - p.z;
      if (dx * dx + dz * dz < minDist * minDist) return false;
    }
    return true;
  }

  // Theme-Specific 3D Environment Props
  if (trackCfg.id === 'coast') {
    waterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1100, 1100),
      new THREE.MeshStandardMaterial({ color: 0x0e9aa7, roughness: 0.18, metalness: 0.35, transparent: true, opacity: 0.88 })
    );
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.position.set(180, -1.6, 40);
    worldGroup.add(waterMesh);

    // Palm Trees
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7c5333, roughness: 0.9 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d9b4e, roughness: 0.7, side: THREE.DoubleSide });
    for (let i = 0; i < 55; i++) {
      const x = (Math.random() - 0.5) * 380;
      const z = (Math.random() - 0.3) * 360;
      if (!isClearOfTrack(x, z, 15)) continue;
      const palm = new THREE.Group();
      palm.position.set(x, -0.3, z);
      const h = 6 + Math.random() * 4;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.42, h, 7), trunkMat);
      trunk.position.y = h / 2;
      trunk.rotation.z = (Math.random() - 0.5) * 0.25;
      trunk.castShadow = true;
      palm.add(trunk);
      for (let f = 0; f < 6; f++) {
        const frond = new THREE.Mesh(new THREE.ConeGeometry(0.9, 3.6, 5), leafMat);
        frond.position.set(0, h, 0);
        frond.rotation.z = Math.PI / 2.4;
        frond.rotation.y = (f / 6) * Math.PI * 2;
        palm.add(frond);
      }
      worldGroup.add(palm);
    }

    // Coastal Lighthouse
    const lh = new THREE.Group();
    lh.position.set(172, -0.3, 60);
    const lhBase = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 4.4, 22, 12), new THREE.MeshStandardMaterial({ color: 0xf8f9fa }));
    lhBase.position.y = 11;
    lhBase.castShadow = true;
    lh.add(lhBase);
    const lhTop = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 4, 12), new THREE.MeshStandardMaterial({ color: 0xe63946 }));
    lhTop.position.y = 22;
    lh.add(lhTop);
    const lhBeacon = new THREE.Mesh(new THREE.SphereGeometry(2.0, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe66d }));
    lhBeacon.position.y = 25;
    lh.add(lhBeacon);
    worldGroup.add(lh);
  } else if (trackCfg.id === 'forest') {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x593a22, roughness: 0.9 });
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x1e5631, roughness: 0.85 });
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b705c, roughness: 0.9 });
    for (let i = 0; i < 85; i++) {
      const x = (Math.random() - 0.5) * 400;
      const z = (Math.random() - 0.3) * 380;
      if (!isClearOfTrack(x, z, 15)) continue;
      if (i % 5 === 0) {
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(3 + Math.random() * 5, 0), rockMat);
        rock.position.set(x, 1.5, z);
        rock.scale.y = 0.8 + Math.random() * 1.2;
        rock.castShadow = true;
        worldGroup.add(rock);
      } else {
        const tree = new THREE.Group();
        tree.position.set(x, -0.3, z);
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3.2, 6), trunkMat);
        tr.position.y = 1.6;
        tree.add(tr);
        const c1 = new THREE.Mesh(new THREE.ConeGeometry(2.6, 5.5, 7), pineMat);
        c1.position.y = 4.6; c1.castShadow = true;
        const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.9, 4.2, 7), pineMat);
        c2.position.y = 7.2; c2.castShadow = true;
        tree.add(c1, c2);
        worldGroup.add(tree);
      }
    }
  } else {
    // Alpine Frost: Snow-capped Mountains, Frosted Pines & Snow Particles
    const mtnMat = new THREE.MeshStandardMaterial({ color: 0x5c728a, roughness: 0.9 });
    const capMat = new THREE.MeshStandardMaterial({ color: 0xf4f9ff, roughness: 0.6 });
    for (let i = 0; i < 18; i++) {
      const ang = (i / 18) * Math.PI * 2;
      const rad = 210 + Math.random() * 60;
      const h = 45 + Math.random() * 45;
      const mtn = new THREE.Group();
      mtn.position.set(Math.cos(ang) * rad, -1, Math.sin(ang) * rad);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(34 + Math.random() * 14, h, 7), mtnMat);
      cone.position.y = h / 2;
      const cap = new THREE.Mesh(new THREE.ConeGeometry(16, h * 0.44, 7), capMat);
      cap.position.y = h * 0.78;
      mtn.add(cone, cap);
      worldGroup.add(mtn);
    }
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
    const frostPine = new THREE.MeshStandardMaterial({ color: 0x2d5a5e, roughness: 0.8 });
    for (let i = 0; i < 65; i++) {
      const x = (Math.random() - 0.5) * 390;
      const z = (Math.random() - 0.3) * 370;
      if (!isClearOfTrack(x, z, 15)) continue;
      const tree = new THREE.Group();
      tree.position.set(x, -0.3, z);
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 2.8, 6), trunkMat);
      tr.position.y = 1.4;
      const c1 = new THREE.Mesh(new THREE.ConeGeometry(2.3, 5.2, 7), frostPine);
      c1.position.y = 4.4; c1.castShadow = true;
      const snowCap = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.5, 7), capMat);
      snowCap.position.y = 6.3;
      tree.add(tr, c1, snowCap);
      worldGroup.add(tree);
    }

    // Falling Snow Particles
    const snowGeo = new THREE.BufferGeometry();
    const snowArr = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) {
      snowArr[i * 3] = (Math.random() - 0.5) * 280;
      snowArr[i * 3 + 1] = Math.random() * 48;
      snowArr[i * 3 + 2] = (Math.random() - 0.5) * 280;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowArr, 3));
    snowPoints = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.65, transparent: true, opacity: 0.85 }));
    worldGroup.add(snowPoints);
  }
}

/* ---------------------------------------------------------------------
   8. Particle Pool (Tire Smoke, Drift Sparks)
   --------------------------------------------------------------------- */
const particles = [];
const partGeo = new THREE.SphereGeometry(0.24, 6, 6);
const partGroup = new THREE.Group();
scene.add(partGroup);

function spawnParticle(pos, vel, color, size = 1, life = 0.45) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 });
  const mesh = new THREE.Mesh(partGeo, mat);
  mesh.position.copy(pos);
  mesh.scale.setScalar(size);
  partGroup.add(mesh);
  particles.push({ mesh, vel, life, maxLife: life });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      partGroup.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = (p.life / p.maxLife) * 0.85;
    p.mesh.scale.multiplyScalar(1 + dt * 1.2);
  }
}

/* ---------------------------------------------------------------------
   9. Race State & Kart Physics
   --------------------------------------------------------------------- */
const TOTAL_LAPS = 3;
let gameState = 'menu'; // 'menu' | 'countdown' | 'racing' | 'paused' | 'finished'
let countdownTimer = 0;
let lastCountInt = 4;
let raceTime = 0;
let camMode = 0; // 0: Chase, 1: Hood/Driver, 2: Far
let racers = [];
let toastTimer = 0;

function showToast(txt) {
  const el = $('toastText');
  el.textContent = txt;
  el.classList.add('show');
  toastTimer = 1.25;
}

function updateCamLabel() {
  const dict = I18N[lang];
  $('camLabel').textContent = [dict.camChase, dict.camHood, dict.camFar][camMode];
}

function findClosestSample(pos, hintIdx) {
  let bestIdx = hintIdx;
  let bestD2 = Infinity;
  // Local window search first
  for (let off = -28; off <= 28; off++) {
    const idx = (hintIdx + off + SAMPLES) % SAMPLES;
    const p = trackSamples[idx].pos;
    const dx = pos.x - p.x, dz = pos.z - p.z;
    const d2 = dx * dx + dz * dz;
    if (d2 < bestD2) { bestD2 = d2; bestIdx = idx; }
  }
  if (bestD2 > 450) {
    for (let idx = 0; idx < SAMPLES; idx++) {
      const p = trackSamples[idx].pos;
      const dx = pos.x - p.x, dz = pos.z - p.z;
      const d2 = dx * dx + dz * dz;
      if (d2 < bestD2) { bestD2 = d2; bestIdx = idx; }
    }
  }
  return bestIdx;
}

function createRacer(charCfg, index, isPlayer) {
  const visual = buildKartMesh(charCfg);
  scene.add(visual.root);

  // Grid formation behind start line
  const startIdx = (SAMPLES - 6 - index * 5) % SAMPLES;
  const s = trackSamples[startIdx];
  const lat = (index % 2 === 0 ? -1 : 1) * 2.4;
  const pos = s.pos.clone().addScaledVector(s.right, lat);
  const heading = Math.atan2(s.tangent.x, s.tangent.z);

  visual.root.position.copy(pos);
  visual.root.rotation.y = heading;

  return {
    isPlayer,
    charCfg,
    visual,
    pos,
    heading,
    speed: 0,
    steerVisual: 0,
    drifting: false,
    driftDir: 0,
    driftCharge: 0,
    boostTimer: 0,
    nitroCharge: 0,
    capsules: isPlayer ? 1 : 0, // Start with 1 N2O capsule
    sampleIdx: startIdx,
    lap: 1,
    checkpoint: 0, // 0 -> 1 (halfway) -> 2 (finish)
    totalProgress: (startIdx / SAMPLES) - 1,
    finished: false,
    finishTime: 0,
    aiLane: (index - 1.5) * 1.9,
    aiPace: DIFFS[selectedDiff].aiScale * (0.96 + (index % 3) * 0.03)
  };
}

function clearRacers() {
  racers.forEach(r => scene.remove(r.visual.root));
  racers = [];
}

function startRace() {
  sfx.init();
  clearRacers();
  const trackCfg = TRACKS[selectedTrack];
  buildTrackAndWorld(trackCfg);

  // Player + 3 AI rivals
  const playerChar = CHARS[selectedChar];
  const others = CHARS.filter((_, i) => i !== selectedChar);
  others.push(CHARS[(selectedChar + 1) % CHARS.length]);

  racers.push(createRacer(playerChar, 0, true));
  others.forEach((c, i) => racers.push(createRacer(c, i + 1, false)));

  gameState = 'countdown';
  countdownTimer = 3.2;
  lastCountInt = 4;
  raceTime = 0;
  toastTimer = 0;
  $('toastText').classList.remove('show');
  $('wrongWay').style.display = 'none';

  $('startPanel').classList.remove('show');
  $('pausePanel').classList.remove('show');
  $('resultPanel').classList.remove('show');
  $('hud').style.display = 'block';
  $('pauseBtn').style.display = 'flex';
  $('camBtn').style.display = 'flex';
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    $('touchControls').style.display = 'block';
  }
}

/* ---------------------------------------------------------------------
   10. Input Handling (Keyboard + Touch)
   --------------------------------------------------------------------- */
const keys = {};
const touch = { left: false, right: false, gas: false, drift: false, boost: false };

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyV' && (gameState === 'racing' || gameState === 'countdown')) {
    camMode = (camMode + 1) % 3;
    updateCamLabel();
  }
  if ((e.code === 'Escape' || e.code === 'KeyP') && (gameState === 'racing' || gameState === 'paused')) {
    togglePause();
  }
  if (e.code === 'Space' && gameState === 'racing') {
    triggerPlayerBoost();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function bindTouchBtn(id, field, onPress) {
  const el = $(id);
  const set = (v) => (e) => {
    e.preventDefault();
    touch[field] = v;
    el.classList.toggle('active', v);
    if (v && onPress) onPress();
  };
  el.addEventListener('touchstart', set(true), { passive: false });
  el.addEventListener('touchend', set(false), { passive: false });
  el.addEventListener('touchcancel', set(false), { passive: false });
}
bindTouchBtn('tLeft', 'left');
bindTouchBtn('tRight', 'right');
bindTouchBtn('tGas', 'gas');
bindTouchBtn('tDrift', 'drift');
bindTouchBtn('tBoost', 'boost', () => { if (gameState === 'racing') triggerPlayerBoost(); });

function triggerPlayerBoost() {
  const p = racers[0];
  if (!p || p.capsules <= 0 || p.boostTimer > 0.3) return;
  p.capsules--;
  p.boostTimer = 2.2;
  sfx.boost();
  showToast(I18N[lang].nitroBoost);
}

function togglePause() {
  if (gameState === 'racing') {
    gameState = 'paused';
    $('pausePanel').classList.add('show');
    sfx.updateEngine(0, false, false);
  } else if (gameState === 'paused') {
    gameState = 'racing';
    $('pausePanel').classList.remove('show');
  }
}

/* ---------------------------------------------------------------------
   11. Physics Step & Minimap
   --------------------------------------------------------------------- */
function stepRacer(r, dt) {
  const s = trackSamples[r.sampleIdx];
  const cfg = r.charCfg;
  let throttle = 0;
  let steer = 0;
  let wantDrift = false;

  if (r.isPlayer) {
    if (keys['KeyW'] || keys['ArrowUp'] || touch.gas) throttle += 1;
    if (keys['KeyS'] || keys['ArrowDown']) throttle -= 0.7;
    if (keys['KeyA'] || keys['ArrowLeft'] || touch.left) steer += 1;
    if (keys['KeyD'] || keys['ArrowRight'] || touch.right) steer -= 1;
    wantDrift = !!(keys['ShiftLeft'] || keys['ShiftRight'] || touch.drift);
  } else {
    // AI Navigation along spline
    const lookAheadIdx = (r.sampleIdx + 14) % SAMPLES;
    const targetSample = trackSamples[lookAheadIdx];
    const targetPos = targetSample.pos.clone().addScaledVector(targetSample.right, r.aiLane);
    const desiredHeading = Math.atan2(targetPos.x - r.pos.x, targetPos.z - r.pos.z);
    let diff = desiredHeading - r.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    steer = Math.max(-1, Math.min(1, diff * 2.4));
    throttle = Math.abs(diff) > 0.55 ? 0.78 : 1.0;

    if (r.boostTimer <= 0 && Math.random() < DIFFS[selectedDiff].aiBoostChance) {
      r.boostTimer = 1.6;
    }
  }

  // Drift state machine
  if (r.isPlayer && wantDrift && r.speed > 14 && (r.drifting || Math.abs(steer) > 0.1)) {
    if (!r.drifting) {
      r.drifting = true;
      r.driftDir = steer >= 0 ? 1 : -1;
      r.driftCharge = 0;
    }
    r.driftCharge += dt * cfg.chargeRate * (0.75 + 0.35 * Math.abs(steer));
    r.nitroCharge = Math.min(100, r.nitroCharge + dt * 26 * cfg.chargeRate);
    if (r.nitroCharge >= 100 && r.capsules < 2) {
      r.nitroCharge = 0;
      r.capsules++;
      sfx.pickup();
    }
  } else {
    if (r.drifting && r.driftCharge >= 0.55) {
      r.boostTimer = Math.max(r.boostTimer, 0.85);
      sfx.boost();
      if (r.isPlayer) showToast(I18N[lang].miniTurbo);
    }
    r.drifting = false;
    r.driftCharge = 0;
  }

  // Speed & Boost
  if (r.boostTimer > 0) r.boostTimer = Math.max(0, r.boostTimer - dt);
  const boosting = r.boostTimer > 0;
  const baseMax = r.isPlayer ? cfg.maxSpeed : cfg.maxSpeed * r.aiPace;
  const maxSpd = boosting ? baseMax * 1.32 : baseMax;

  // Off-road surface check
  const rel = r.pos.clone().sub(s.pos);
  const lateral = rel.dot(s.right);
  const offRoad = Math.abs(lateral) > ROAD_HALF_W + 0.5;
  const effectiveMax = offRoad && !boosting ? maxSpd * 0.72 : maxSpd;

  if (throttle > 0 || boosting) {
    const accelForce = boosting ? cfg.accel * 2.1 : cfg.accel * Math.max(throttle, 0.4);
    r.speed += accelForce * dt;
  } else if (throttle < 0) {
    r.speed += cfg.accel * 1.3 * throttle * dt;
  } else {
    r.speed *= Math.pow(0.45, dt);
  }
  r.speed = Math.max(-14, Math.min(effectiveMax, r.speed));

  // Steering
  const spdFactor = Math.min(1, Math.abs(r.speed) / 14);
  const revSign = r.speed >= -0.5 ? 1 : -1;
  if (r.drifting) {
    const turn = (r.driftDir * 0.65 + steer * 0.55) * cfg.driftTurn * dt * spdFactor;
    r.heading += turn;
  } else {
    r.heading += steer * 1.55 * dt * spdFactor * revSign;
  }

  // Gentle Rookie steer assist
  if (r.isPlayer && DIFFS[selectedDiff].steerAssist > 0 && r.speed > 10) {
    const trackYaw = Math.atan2(s.tangent.x, s.tangent.z);
    let yawErr = trackYaw - r.heading;
    while (yawErr > Math.PI) yawErr -= Math.PI * 2;
    while (yawErr < -Math.PI) yawErr += Math.PI * 2;
    if (Math.abs(yawErr) < 0.7) {
      r.heading += yawErr * DIFFS[selectedDiff].steerAssist * dt * 2.0;
    }
  }

  // Integrate Position
  r.pos.x += Math.sin(r.heading) * r.speed * dt;
  r.pos.z += Math.cos(r.heading) * r.speed * dt;

  // Track Lookup & Wall Constraint
  const prevIdx = r.sampleIdx;
  r.sampleIdx = findClosestSample(r.pos, prevIdx);
  const ns = trackSamples[r.sampleIdx];
  const nRel = r.pos.clone().sub(ns.pos);
  const nLat = nRel.dot(ns.right);

  if (Math.abs(nLat) > WALL_HALF_W - 0.9) {
    const sign = Math.sign(nLat);
    const excess = Math.abs(nLat) - (WALL_HALF_W - 0.9);
    r.pos.addScaledVector(ns.right, -sign * excess);
    r.speed *= 0.88;
    if (r.isPlayer && excess > 0.15) sfx.bump();
  }
  r.pos.y = ns.pos.y;

  // Boost Pads & Crystals
  for (const pad of boostPads) {
    if (r.pos.distanceToSquared(pad.pos) < pad.radius * pad.radius) {
      if (r.boostTimer < 0.9) {
        r.boostTimer = 1.25;
        if (r.isPlayer) { sfx.boost(); showToast(I18N[lang].boostPad); }
      }
    }
  }
  for (const cr of crystals) {
    if (cr.cooldown <= 0 && r.pos.distanceToSquared(cr.pos) < 5.2) {
      cr.cooldown = 5.0;
      cr.mesh.visible = false;
      if (r.isPlayer) {
        sfx.pickup();
        r.nitroCharge = Math.min(100, r.nitroCharge + 35);
        if (r.nitroCharge >= 100 && r.capsules < 2) {
          r.nitroCharge = 0;
          r.capsules++;
        }
      }
    }
  }

  // Lap & Checkpoint Progress
  const tNorm = r.sampleIdx / SAMPLES;
  if (tNorm > 0.4 && tNorm < 0.65 && r.checkpoint === 0) r.checkpoint = 1;
  if (prevIdx > SAMPLES * 0.85 && r.sampleIdx < SAMPLES * 0.15 && r.checkpoint === 1) {
    r.checkpoint = 0;
    if (r.lap < TOTAL_LAPS) {
      r.lap++;
      if (r.isPlayer) {
        sfx.lap();
        if (r.lap === TOTAL_LAPS) showToast(I18N[lang].finalLap);
      }
    } else if (!r.finished) {
      r.finished = true;
      r.finishTime = raceTime;
      if (r.isPlayer) finishRace();
    }
  }
  r.totalProgress = (r.lap - 1) + tNorm;

  // Visual Kart Transform & Animations
  r.visual.root.position.copy(r.pos);
  r.visual.root.rotation.y = r.heading;

  // Pitch from track slope
  const slope = Math.asin(Math.max(-0.5, Math.min(0.5, ns.tangent.y)));
  r.visual.bodyGroup.rotation.x = -slope;
  const targetSlip = r.drifting ? r.driftDir * 0.42 : 0;
  r.visual.bodyGroup.rotation.y += (targetSlip - r.visual.bodyGroup.rotation.y) * Math.min(1, dt * 10);

  r.steerVisual += (steer * 0.45 - r.steerVisual) * Math.min(1, dt * 12);
  r.visual.frontSteerGroups.forEach(g => { g.rotation.y = r.steerVisual; });
  r.visual.wheels.forEach(w => { w.rotation.x += r.speed * dt * 2.2; });
  r.visual.flames.forEach(f => {
    f.visible = boosting;
    if (boosting) f.scale.set(1, 0.8 + Math.random() * 0.5, 1);
  });

  // Drift Smoke & Sparks
  if (r.drifting && Math.random() < 0.65) {
    const sparkColor = r.driftCharge > 1.2 ? 0xc77dff : r.driftCharge > 0.55 ? 0xff9f1c : 0xeef5ff;
    const backPos = r.pos.clone().add(new THREE.Vector3(-Math.sin(r.heading) * 1.1, 0.2, -Math.cos(r.heading) * 1.1));
    spawnParticle(backPos, new THREE.Vector3((Math.random() - 0.5) * 2, 1.5, (Math.random() - 0.5) * 2), sparkColor, 0.9, 0.32);
  }
}

function resolveKartCollisions() {
  const minDist = 1.9;
  for (let i = 0; i < racers.length; i++) {
    for (let j = i + 1; j < racers.length; j++) {
      const a = racers[i], b = racers[j];
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z;
      const d2 = dx * dx + dz * dz;
      if (d2 > 0.001 && d2 < minDist * minDist) {
        const d = Math.sqrt(d2);
        const push = (minDist - d) * 0.5;
        const nx = dx / d, nz = dz / d;
        a.pos.x -= nx * push; a.pos.z -= nz * push;
        b.pos.x += nx * push; b.pos.z += nz * push;
      }
    }
  }
}

function finishRace() {
  gameState = 'finished';
  sfx.updateEngine(0, false, false);
  sfx.win();

  const sorted = [...racers].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.totalProgress - a.totalProgress;
  });

  const myRank = sorted.findIndex(r => r.isPlayer) + 1;
  const dict = I18N[lang];
  $('resultRank').textContent = dict.rankFmt(myRank);
  $('resultTime').textContent = fmtTime(raceTime);

  const isNew = saveBestTime(TRACKS[selectedTrack].id, DIFFS[selectedDiff].id, raceTime);
  $('resultNewBest').style.display = isNew ? 'block' : 'none';

  const list = $('standingsList');
  list.innerHTML = '';
  sorted.forEach((r, idx) => {
    const row = document.createElement('div');
    row.className = 'standing-row' + (r.isPlayer ? ' me' : '');
    const tStr = r.finished ? fmtTime(r.finishTime) : '--:--.--';
    row.innerHTML = `<span>#${idx + 1} ${r.charCfg.name[lang]}${r.isPlayer ? dict.meTag : ''}</span><span>${tStr}</span>`;
    list.appendChild(row);
  });

  $('resultPanel').classList.add('show');
}

function drawMinimap() {
  const cvs = $('minimap');
  const g = cvs.getContext('2d');
  g.clearRect(0, 0, cvs.width, cvs.height);
  if (trackSamples.length === 0) return;

  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (let i = 0; i < SAMPLES; i += 6) {
    const p = trackSamples[i].pos;
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
  }
  const pad = 14;
  const span = Math.max(maxX - minX, maxZ - minZ, 1);
  const scale = (cvs.width - pad * 2) / span;
  const mapX = (x) => pad + (x - minX) * scale;
  const mapY = (z) => pad + (z - minZ) * scale;

  g.beginPath();
  for (let i = 0; i < SAMPLES; i += 4) {
    const p = trackSamples[i].pos;
    if (i === 0) g.moveTo(mapX(p.x), mapY(p.z));
    else g.lineTo(mapX(p.x), mapY(p.z));
  }
  g.closePath();
  g.strokeStyle = 'rgba(255,255,255,0.38)';
  g.lineWidth = 5;
  g.stroke();

  racers.forEach(r => {
    g.beginPath();
    g.arc(mapX(r.pos.x), mapY(r.pos.z), r.isPlayer ? 5 : 3.5, 0, Math.PI * 2);
    g.fillStyle = r.isPlayer ? '#ffb62e' : '#5ce1ff';
    g.fill();
    if (r.isPlayer) {
      g.strokeStyle = '#ffffff';
      g.lineWidth = 1.5;
      g.stroke();
    }
  });
}

/* ---------------------------------------------------------------------
   12. Main Animation Loop
   --------------------------------------------------------------------- */
let lastTime = performance.now();
const camPosSmooth = new THREE.Vector3();
const camLookSmooth = new THREE.Vector3();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // Menu 3D previews
  if (gameState === 'menu') {
    previewRenderers.forEach((p, idx) => {
      p.mesh.rotation.y += dt * (idx === selectedChar ? 1.4 : 0.45);
      p.renderer.render(p.scene, p.camera);
    });
    // Orbit preview of selected track in background
    if (trackSamples.length > 0) {
      const ang = now * 0.00018;
      camera.position.set(Math.cos(ang) * 165, 62, Math.sin(ang) * 165 + 50);
      camera.lookAt(0, 2, 55);
    }
    renderer.render(scene, camera);
    return;
  }

  // Crystals spin & cooldown
  crystals.forEach(cr => {
    if (cr.cooldown > 0) {
      cr.cooldown -= dt;
      if (cr.cooldown <= 0) cr.mesh.visible = true;
    }
    cr.mesh.rotation.y += dt * 2.4;
  });
  if (snowPoints) {
    const arr = snowPoints.geometry.attributes.position.array;
    for (let i = 1; i < arr.length; i += 3) {
      arr[i] -= dt * 9;
      if (arr[i] < 0) arr[i] = 48;
    }
    snowPoints.geometry.attributes.position.needsUpdate = true;
  }

  if (gameState === 'countdown') {
    countdownTimer -= dt;
    const cInt = Math.ceil(countdownTimer);
    if (cInt !== lastCountInt && cInt >= 1 && cInt <= 3) {
      lastCountInt = cInt;
      $('countdownText').textContent = String(cInt);
      $('countdownText').style.color = cInt === 1 ? '#68f09c' : '#ffb62e';
      $('countdownText').classList.add('show');
      sfx.beep(440, 0.14);
    }
    if (countdownTimer <= 0) {
      gameState = 'racing';
      $('countdownText').textContent = I18N[lang].go;
      $('countdownText').style.color = '#68f09c';
      sfx.beep(880, 0.25);
      setTimeout(() => $('countdownText').classList.remove('show'), 700);
    }
  } else if (gameState === 'racing') {
    raceTime += dt;
    racers.forEach(r => stepRacer(r, dt));
    resolveKartCollisions();
    updateParticles(dt);

    const p = racers[0];
    sfx.updateEngine(Math.min(1, Math.abs(p.speed) / p.charCfg.maxSpeed), p.drifting, true);

    // Wrong way check
    const s = trackSamples[p.sampleIdx];
    const dot = Math.sin(p.heading) * s.tangent.x + Math.cos(p.heading) * s.tangent.z;
    $('wrongWay').style.display = (dot < -0.4 && p.speed > 5) ? 'block' : 'none';

    // HUD Update
    const sorted = [...racers].sort((a, b) => b.totalProgress - a.totalProgress);
    const rank = sorted.indexOf(p) + 1;
    $('hudPos').textContent = `${rank}/${racers.length}`;
    $('hudLap').textContent = `${p.lap}/${TOTAL_LAPS}`;
    $('hudTime').textContent = fmtTime(raceTime);
    $('hudSpeed').textContent = String(Math.round(Math.abs(p.speed) * 3.4));
    $('nitroFill').style.width = `${p.nitroCharge}%`;
    $('cap0').classList.toggle('ready', p.capsules >= 1);
    $('cap1').classList.toggle('ready', p.capsules >= 2);
    drawMinimap();

    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) $('toastText').classList.remove('show');
    }
  }

  // Camera follow player
  const player = racers[0];
  if (player) {
    const fwd = new THREE.Vector3(Math.sin(player.heading), 0, Math.cos(player.heading));
    const desiredPos = player.pos.clone();
    const desiredLook = player.pos.clone();

    if (camMode === 0) {
      desiredPos.addScaledVector(fwd, -7.2).add(new THREE.Vector3(0, 3.4, 0));
      desiredLook.addScaledVector(fwd, 9.0).add(new THREE.Vector3(0, 1.1, 0));
    } else if (camMode === 1) {
      desiredPos.addScaledVector(fwd, 0.4).add(new THREE.Vector3(0, 1.55, 0));
      desiredLook.addScaledVector(fwd, 14.0).add(new THREE.Vector3(0, 1.2, 0));
    } else {
      desiredPos.addScaledVector(fwd, -11.5).add(new THREE.Vector3(0, 5.4, 0));
      desiredLook.addScaledVector(fwd, 10.0).add(new THREE.Vector3(0, 1.0, 0));
    }

    if (camMode === 1) {
      camera.position.copy(desiredPos);
      camera.lookAt(desiredLook);
    } else {
      camPosSmooth.lerp(desiredPos, Math.min(1, dt * 10));
      camLookSmooth.lerp(desiredLook, Math.min(1, dt * 12));
      camera.position.copy(camPosSmooth);
      camera.lookAt(camLookSmooth);
    }
    const targetFov = player.boostTimer > 0 ? 74 : 62;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------
   13. Button Wiring & Boot
   --------------------------------------------------------------------- */
$('startBtn').addEventListener('click', startRace);
$('pauseBtn').addEventListener('click', togglePause);
$('resumeBtn').addEventListener('click', togglePause);
$('restartBtn').addEventListener('click', startRace);
$('againBtn').addEventListener('click', startRace);

function backToMenu() {
  gameState = 'menu';
  sfx.updateEngine(0, false, false);
  clearRacers();
  $('hud').style.display = 'none';
  $('pauseBtn').style.display = 'none';
  $('camBtn').style.display = 'none';
  $('touchControls').style.display = 'none';
  $('pausePanel').classList.remove('show');
  $('resultPanel').classList.remove('show');
  $('startPanel').classList.add('show');
  updateMenuSelections();
}
$('menuBtn').addEventListener('click', backToMenu);
$('resultMenuBtn').addEventListener('click', backToMenu);

$('camBtn').addEventListener('click', () => {
  camMode = (camMode + 1) % 3;
  updateCamLabel();
});

$('muteBtn').addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('tk3d_mute', muted ? '1' : '0');
  $('iconSoundOn').style.display = muted ? 'none' : 'block';
  $('iconSoundOff').style.display = muted ? 'block' : 'none';
  $('muteBtn').classList.toggle('off', muted);
});
$('iconSoundOn').style.display = muted ? 'none' : 'block';
$('iconSoundOff').style.display = muted ? 'block' : 'none';
$('muteBtn').classList.toggle('off', muted);

$('qualBtn').addEventListener('click', () => {
  highQuality = !highQuality;
  localStorage.setItem('tk3d_hq', highQuality ? '1' : '0');
  applyQuality();
});

$('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLang();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initialize default world behind menu & start loop
buildTrackAndWorld(TRACKS[0]);
applyLang();
$('loading').classList.add('hide');
requestAnimationFrame(animate);
</script>
